<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Shop - PlayCrazyGames</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .shop-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .shop-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .shop-item:hover {
            border-color: #667eea;
            transform: translateY(-5px);
        }
        .item-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .item-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }
        .buy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        /* Hide ads */
        .ad-container {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-home">← Back to Hub</a>
        <h1 style="color: white; text-align: center;">🛒 Premium Shop</h1>

        <div class="shop-grid">
            <div class="shop-item">
                <div class="item-icon">🚫</div>
                <h3>Remove Ads</h3>
                <p>Enjoy an ad-free experience across all games.</p>
                <div class="item-price">$1.99</div>
                <button class="buy-btn" onclick="buyItem('Remove Ads')">Purchase</button>
            </div>

            <div class="shop-item">
                <div class="item-icon">💎</div>
                <h3>Premium Skins</h3>
                <p>Unlock golden skins for Snake and Chess.</p>
                <div class="item-price">$0.99</div>
                <button class="buy-btn" onclick="buyItem('Premium Skins')">Purchase</button>
            </div>

            <div class="shop-item">
                <div class="item-icon">⚡</div>
                <h3>Power-ups Pack</h3>
                <p>Extra lives and speed boosts in arcade games.</p>
                <div class="item-price">$2.49</div>
                <button class="buy-btn" onclick="buyItem('Power-ups Pack')">Purchase</button>
            </div>
        </div>
    </div>

    <script>
        function buyItem(name) {
            if (typeof Android !== 'undefined' && Android.showToast) {
                Android.showToast("Purchasing " + name + "... (Coming Soon)");
            } else {
                alert("Purchasing " + name + "... (Feature coming to the App)");
            }
        }
    </script>
</body>
</html>
