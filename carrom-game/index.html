<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Carrom – Auto Extra Turn | Manual Turn Switch | Queen Cover</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 30% 20%, #2d472a, #0f1e0c);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 16px 24px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
        }
        canvas {
            display: block;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 0 0 2px #f7e3b2;
            border-radius: 28px;
            cursor: grab;
            background: #d9b382;
        }
        canvas:active { cursor: grabbing; }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 20px;
            background: #2d241ce6;
            padding: 8px 20px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
        }
        .turn-indicator {
            background: #e4a22d;
            padding: 6px 24px;
            border-radius: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px black;
            box-shadow: 0 3px 6px black;
            font-size: 1rem;
            min-width: 180px;
            text-align: center;
        }
        .status {
            background: #2c1e12;
            padding: 4px 16px;
            border-radius: 40px;
            color: #ffd966;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            background: #8b5a2b;
            border: none;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            box-shadow: 0 3px 0 #4a2a10;
            transition: 0.07s linear;
            font-family: inherit;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4a2a10; }
        .turn-btn { background: #a56b2f; }
        .turn-btn.special { background: #3a6b2f; }
        .reset-btn { background: #ffcd7e; color: #3e2a1f; }
        .mode-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000cc;
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .mode-card {
            background: #f3e7cf;
            padding: 30px 45px;
            border-radius: 90px;
            text-align: center;
            box-shadow: 0 20px 35px black;
            width: 300px;
        }
        .mode-card button {
            margin: 12px 10px;
            padding: 12px 28px;
            font-size: 1.2rem;
            background: #7a4a22;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }
        .power-meter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1712e8;
            backdrop-filter: blur(8px);
            padding: 6px 22px;
            border-radius: 100px;
            font-weight: bold;
            pointer-events: none;
            font-size: 1rem;
            color: #ffdd99;
            transition: 0.1s;
            white-space: nowrap;
            font-family: monospace;
        }
        .power-meter.green-active { background: #2e7d32e6; color: #ffffff; text-shadow: 0 0 3px #004d00; }
    </style>
</head>
<body>
<div id="modeOverlay" class="mode-overlay">
    <div class="mode-card">
        <h2>🏆 CARROM MANUAL TURNS 🎯</h2>
        <p>Select Game Mode</p>
        <button id="twoPlayerModeBtn">👥 2P HOT SEAT</button>
        <button id="vsAIModeBtn">🤖 VS AI (BOT)</button>
    </div>
</div>
<div class="game-container">
    <canvas id="carromCanvas" width="1000" height="1000"></canvas>
    <div class="info-panel">
        <div class="turn-indicator" id="turnText">⚡ WAITING</div>
        <div class="status" id="statusMsg">Queen: free</div>
    </div>
    <div id="turnButtonsContainer" class="button-group"></div>
    <div class="button-group">
        <button id="resetGameBtn" class="action-btn reset-btn">🔄 NEW GAME</button>
    </div>
    <div id="powerMeter" class="power-meter">🔙 PULL BACK → POWER 0%</div>
</div>

<script>
    (function(){
        // ---------- BOARD GEOMETRY (67% scaled) ----------
        const canvas = document.getElementById('carromCanvas');
        const ctx = canvas.getContext('2d');
        
        const BOARD_SIZE = 496;
        const BOARD_LEFT = (1000 - BOARD_SIZE) / 2;
        const BOARD_RIGHT = BOARD_LEFT + BOARD_SIZE;
        const BOARD_TOP = (1000 - BOARD_SIZE) / 2;
        const BOARD_BOTTOM = BOARD_TOP + BOARD_SIZE;
        const BOARD_CX = (BOARD_LEFT + BOARD_RIGHT) / 2;
        const BOARD_CY = (BOARD_TOP + BOARD_BOTTOM) / 2;
        
        const BASELINE_INNER_OFFSET = 32;
        const BASELINE_OUTER_OFFSET = 48;
        
        const COIN_RADIUS = 9;
        const STRIKER_RADIUS = 11;
        const POCKET_RADIUS = 52;   // enlarged
        
        const pockets = [
            { x: BOARD_LEFT-12, y: BOARD_TOP-12, r: POCKET_RADIUS },
            { x: BOARD_RIGHT+12, y: BOARD_TOP-12, r: POCKET_RADIUS },
            { x: BOARD_LEFT-12, y: BOARD_BOTTOM+12, r: POCKET_RADIUS },
            { x: BOARD_RIGHT+12, y: BOARD_BOTTOM+12, r: POCKET_RADIUS }
        ];
        
        const diag1 = { x1: pockets[0].x, y1: pockets[0].y, x2: pockets[3].x, y2: pockets[3].y };
        const diag2 = { x1: pockets[1].x, y1: pockets[1].y, x2: pockets[2].x, y2: pockets[2].y };
        
        function intersectHorizontalWithLine(y, line) {
            if (Math.abs(line.y2 - line.y1) < 1e-5) return null;
            let t = (y - line.y1) / (line.y2 - line.y1);
            if (t < 0 || t > 1) return null;
            let x = line.x1 + t * (line.x2 - line.x1);
            return { x, y };
        }
        
        function getBaselineLimits(y) {
            let inter1 = intersectHorizontalWithLine(y, diag1);
            let inter2 = intersectHorizontalWithLine(y, diag2);
            if (!inter1 || !inter2) return { min: BOARD_LEFT+BASELINE_INNER_OFFSET, max: BOARD_RIGHT-BASELINE_INNER_OFFSET };
            let x1 = Math.min(inter1.x, inter2.x);
            let x2 = Math.max(inter1.x, inter2.x);
            return { min: x1 + 5, max: x2 - 5 };
        }
        
        const bottomBaselineY = BOARD_BOTTOM - BASELINE_INNER_OFFSET;
        const topBaselineY = BOARD_TOP + BASELINE_INNER_OFFSET;
        let bottomLimits = getBaselineLimits(bottomBaselineY);
        let topLimits = getBaselineLimits(topBaselineY);
        
        function getStrikerLimits(player) {
            return player === 'white' ? bottomLimits : topLimits;
        }
        
        // ---------- STATE ----------
        let objects = [];
        let coinsList = [];
        let strikerObj = null;
        let animationId = null;
        
        let gameMode = null;          // 'twoPlayer' or 'vsAI'
        let currentTurn = 'white';    // white = bottom, black = top
        let queenPendingCover = { active: false, player: null };
        let gameWinner = null;
        let isMoving = false;
        let waitingForManualTurn = false; // after a turn with no extra, we wait for button
        
        let aimAngle = 0;
        let powerDragActive = false;
        let dragOrigin = null;
        let currentPower = 0;
        let botShootTimer = null;
        
        const FRICTION_AIR = 0.985;
        const MIN_VEL = 0.35;
        const MASS_STRIKER = 3;
        const MASS_COIN = 1;
        
        // ---------- UI ----------
        function updateUI() {
            let turnName = (currentTurn === 'white') ? '⚪ WHITE (bottom)' : '⚫ BLACK (top)';
            if(gameWinner) turnName = `🏆 ${gameWinner.toUpperCase()} WINS! 🏆`;
            document.getElementById('turnText').innerHTML = turnName;
            let statusText = queenPendingCover.active ? `⚠️ QUEEN MUST BE COVERED by ${queenPendingCover.player === 'white' ? 'WHITE' : 'BLACK'}!` : "Queen: free";
            document.getElementById('statusMsg').innerHTML = statusText;
        }
        
        function removeCoinFromWorld(coin) {
            const idxObj = objects.indexOf(coin);
            if(idxObj !== -1) objects.splice(idxObj,1);
            const idxCoin = coinsList.indexOf(coin);
            if(idxCoin !== -1) coinsList.splice(idxCoin,1);
        }
        
        function respawnQueen() {
            let queenExists = coinsList.some(c => c.type === 'queen');
            if(!queenExists) {
                let queen = { id:'queen', type:'queen', x:BOARD_CX, y:BOARD_CY, vx:0, vy:0, radius:COIN_RADIUS, mass:MASS_COIN, color:'#E34234', label:'Q' };
                objects.push(queen);
                coinsList.push(queen);
            }
        }
        
        // Create striker exactly on inner baseline (touching the line). Also ensure it's within limits.
        function createStriker() {
            if(strikerObj) {
                const idx = objects.indexOf(strikerObj);
                if(idx !== -1) objects.splice(idx,1);
            }
            const strikerY = (currentTurn === 'white') ? bottomBaselineY : topBaselineY;
            const limits = getStrikerLimits(currentTurn);
            let startX = Math.min(limits.max, Math.max(limits.min, BOARD_CX));
            strikerObj = {
                id: 'striker',
                type: 'striker',
                x: startX,
                y: strikerY,
                vx: 0, vy: 0,
                radius: STRIKER_RADIUS,
                mass: MASS_STRIKER,
                color: '#EABB5E',
                label: 'S'
            };
            objects.push(strikerObj);
        }
        
        function setStrikerX(newX) {
            if(gameWinner || isMoving) return;
            if((currentTurn === 'white' && strikerObj && strikerObj.y > BOARD_CY) ||
               (currentTurn === 'black' && strikerObj && strikerObj.y < BOARD_CY)) {
                const limits = getStrikerLimits(currentTurn);
                let clamped = Math.min(limits.max, Math.max(limits.min, newX));
                if(strikerObj) strikerObj.x = clamped;
            }
        }
        
        // ---------- QUEEN COVER RULE (returns extra turn flag) ----------
        function handlePocketCoin(coin, isStrikerPocket, currentPlayerColor) {
            if(isStrikerPocket) {
                createStriker();   // respawn striker on same baseline
                return false;
            }
            
            if(coin.type === 'queen') {
                if(queenPendingCover.active) {
                    removeCoinFromWorld(coin);
                    queenPendingCover.active = false;
                } else {
                    queenPendingCover.active = true;
                    queenPendingCover.player = currentPlayerColor;
                    removeCoinFromWorld(coin);
                }
                return true; // extra turn (must cover)
            }
            
            // normal coin
            const isOwnCoin = (coin.type === currentPlayerColor);
            removeCoinFromWorld(coin);
            
            if(queenPendingCover.active && queenPendingCover.player === currentPlayerColor && isOwnCoin) {
                queenPendingCover.active = false;
                return true; // successful cover -> extra turn
            } 
            else if(queenPendingCover.active && queenPendingCover.player === currentPlayerColor && !isOwnCoin) {
                queenPendingCover.active = false;
                respawnQueen();
                return false;
            }
            
            return isOwnCoin;
        }
        
        function checkPocketingAndGetExtraTurnFlag(currentPlayerColor) {
            let extraTurn = false;
            for(let i=objects.length-1; i>=0; i--) {
                const obj = objects[i];
                for(let p of pockets) {
                    const dx = obj.x - p.x, dy = obj.y - p.y;
                    if(Math.hypot(dx,dy) < p.r) {
                        const isStriker = (obj.type === 'striker');
                        const givesExtra = handlePocketCoin(obj, isStriker, currentPlayerColor);
                        if(givesExtra) extraTurn = true;
                        break;
                    }
                }
            }
            return extraTurn;
        }
        
        // ---------- PHYSICS ----------
        function applyPhysics() {
            for(let obj of objects) {
                if(obj.x - obj.radius < BOARD_LEFT) { obj.x = BOARD_LEFT + obj.radius; obj.vx = -obj.vx * 0.98; }
                if(obj.x + obj.radius > BOARD_RIGHT) { obj.x = BOARD_RIGHT - obj.radius; obj.vx = -obj.vx * 0.98; }
                if(obj.y - obj.radius < BOARD_TOP) { obj.y = BOARD_TOP + obj.radius; obj.vy = -obj.vy * 0.98; }
                if(obj.y + obj.radius > BOARD_BOTTOM) { obj.y = BOARD_BOTTOM - obj.radius; obj.vy = -obj.vy * 0.98; }
                
                obj.vx *= FRICTION_AIR;
                obj.vy *= FRICTION_AIR;
                if(Math.abs(obj.vx) < MIN_VEL) obj.vx = 0;
                if(Math.abs(obj.vy) < MIN_VEL) obj.vy = 0;
                obj.x += obj.vx;
                obj.y += obj.vy;
            }
            // Elastic collisions
            for(let i=0; i<objects.length; i++) {
                for(let j=i+1; j<objects.length; j++) {
                    const a = objects[i], b = objects[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.hypot(dx,dy);
                    const minDist = a.radius + b.radius;
                    if(dist < minDist) {
                        const angle = Math.atan2(dy, dx);
                        const overlap = minDist - dist;
                        const correction = overlap/2;
                        a.x += Math.cos(angle) * correction;
                        a.y += Math.sin(angle) * correction;
                        b.x -= Math.cos(angle) * correction;
                        b.y -= Math.sin(angle) * correction;
                        const nx = dx/dist, ny = dy/dist;
                        const vrelx = a.vx - b.vx, vrely = a.vy - b.vy;
                        const dot = vrelx*nx + vrely*ny;
                        if(dot < 0) {
                            const e = 0.85;
                            const m1 = a.mass, m2 = b.mass;
                            const imp = (1+e)*dot / ((1/m1)+(1/m2));
                            a.vx -= imp * nx / m1;
                            a.vy -= imp * ny / m1;
                            b.vx += imp * nx / m2;
                            b.vy += imp * ny / m2;
                        }
                    }
                }
            }
        }
        
        function isAllStopped() {
            return objects.every(obj => Math.abs(obj.vx) < 0.35 && Math.abs(obj.vy) < 0.35);
        }
        
        // Called when movement stops. extraTurnFlag true -> same player gets another shot (auto striker respawn)
        // false -> turn ends, we set waitingForManualTurn = true and clear striker.
        function handleTurnEnd(extraTurnFlag) {
            if(gameWinner) return;
            if(isAllStopped() && isMoving) {
                isMoving = false;
                if(extraTurnFlag) {
                    // Extra turn: same player, striker respawns on same baseline automatically
                    createStriker();
                    updateUI();
                    // If it's bot's turn in vsAI mode, trigger bot again automatically
                    if(gameMode === 'vsAI' && currentTurn === 'black' && !gameWinner) {
                        if(botShootTimer) clearTimeout(botShootTimer);
                        botShootTimer = setTimeout(() => botAIShoot(), 200);
                    }
                } else {
                    // No extra turn: remove striker, turn must be manually switched by button
                    if(strikerObj) {
                        const idx = objects.indexOf(strikerObj);
                        if(idx !== -1) objects.splice(idx,1);
                        strikerObj = null;
                    }
                    waitingForManualTurn = true;
                    updateUI();
                }
            }
        }
        
        // ---------- BOT AI (intelligent, triggers extra turn automatically) ----------
        function findBestBotShot() {
            let targetCoins = coinsList.filter(c => c.type === 'black');
            if(targetCoins.length === 0) targetCoins = coinsList.filter(c => c.type !== 'queen');
            let bestShot = null;
            let bestQuality = Infinity;
            for(let coin of targetCoins) {
                for(let pocket of pockets) {
                    let dx = pocket.x - coin.x;
                    let dy = pocket.y - coin.y;
                    let distToPocket = Math.hypot(dx, dy);
                    if(distToPocket < 5) continue;
                    let dirX = dx / distToPocket;
                    let dirY = dy / distToPocket;
                    let behindX = coin.x - dirX * (COIN_RADIUS + STRIKER_RADIUS + 5);
                    let behindY = coin.y - dirY * (COIN_RADIUS + STRIKER_RADIUS + 5);
                    const baselineY = topBaselineY;
                    if(Math.abs(behindY - baselineY) < 18) {
                        let limits = getStrikerLimits('black');
                        if(behindX >= limits.min && behindX <= limits.max) {
                            let angle = Math.atan2(coin.y - baselineY, coin.x - behindX);
                            let power = Math.min(38, Math.max(18, distToPocket * 0.85));
                            let quality = Math.abs(angle - Math.atan2(dy, dx)) + Math.random() * 0.2;
                            if(quality < bestQuality) {
                                bestQuality = quality;
                                bestShot = { strikerX: behindX, aimAngle: angle, power: power };
                            }
                        }
                    }
                }
            }
            if(!bestShot) {
                let limits = getStrikerLimits('black');
                let randX = limits.min + Math.random() * (limits.max - limits.min);
                let randAngle = (Math.random() - 0.5) * 1.2;
                let power = 20 + Math.random() * 20;
                return { strikerX: randX, aimAngle: randAngle, power: power };
            }
            return bestShot;
        }
        
        function botAIShoot() {
            if(gameWinner || currentTurn !== 'black' || isMoving) return;
            if(strikerObj) {
                const idx = objects.indexOf(strikerObj);
                if(idx !== -1) objects.splice(idx,1);
                strikerObj = null;
            }
            const shot = findBestBotShot();
            const strikerY = topBaselineY;
            strikerObj = {
                id: 'striker',
                type: 'striker',
                x: shot.strikerX,
                y: strikerY,
                vx: 0, vy: 0,
                radius: STRIKER_RADIUS,
                mass: MASS_STRIKER,
                color: '#EABB5E',
                label: 'S'
            };
            objects.push(strikerObj);
            strikerObj.vx = Math.cos(shot.aimAngle) * (shot.power * 0.9);
            strikerObj.vy = Math.sin(shot.aimAngle) * (shot.power * 0.9);
            isMoving = true;
        }
        
        // ---------- AIMING & POWER (max 40%) ----------
        function isPocketPossibleFromAngle(angleRad) {
            if(!strikerObj) return false;
            let closestDist = 300;
            let hitCoin = null;
            for(let coin of coinsList) {
                let toCoinX = coin.x - strikerObj.x;
                let toCoinY = coin.y - strikerObj.y;
                let proj = (toCoinX * Math.cos(angleRad) + toCoinY * Math.sin(angleRad));
                if(proj > 0) {
                    let perpX = toCoinX - proj*Math.cos(angleRad);
                    let perpY = toCoinY - proj*Math.sin(angleRad);
                    let perpDist = Math.hypot(perpX, perpY);
                    if(perpDist < COIN_RADIUS + STRIKER_RADIUS && proj < closestDist) {
                        closestDist = proj;
                        hitCoin = coin;
                    }
                }
            }
            if(hitCoin) {
                for(let p of pockets) {
                    let toPocket = { x: p.x - hitCoin.x, y: p.y - hitCoin.y };
                    let pocketAngle = Math.atan2(toPocket.y, toPocket.x);
                    let diff = Math.abs(pocketAngle - angleRad);
                    if(diff < 0.55) return true;
                }
            }
            return false;
        }
        
        function shootStriker(powerVal, angleRad) {
            if(isMoving || gameWinner) return false;
            if(!strikerObj) return false;
            strikerObj.vx = Math.cos(angleRad) * (powerVal * 0.9);
            strikerObj.vy = Math.sin(angleRad) * (powerVal * 0.9);
            isMoving = true;
            powerDragActive = false;
            document.getElementById('powerMeter').classList.remove('green-active');
            return true;
        }
        
        // ---------- DRAWING ----------
        function drawBoardAndMarkings() {
            ctx.fillStyle = '#dbb067';
            ctx.fillRect(0,0,1000,1000);
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(BOARD_LEFT-14, BOARD_TOP-14, BOARD_SIZE+28, BOARD_SIZE+28);
            ctx.fillStyle = '#F7E5C2';
            ctx.fillRect(BOARD_LEFT, BOARD_TOP, BOARD_SIZE, BOARD_SIZE);
            
            for(let p of pockets) {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r-12, 0, Math.PI*2); ctx.fillStyle = '#4e2e14'; ctx.fill();
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r-22, 0, Math.PI*2); ctx.fillStyle = '#1f1409'; ctx.fill();
            }
            
            ctx.beginPath();
            ctx.moveTo(diag1.x1, diag1.y1);
            ctx.lineTo(diag1.x2, diag1.y2);
            ctx.moveTo(diag2.x1, diag2.y1);
            ctx.lineTo(diag2.x2, diag2.y2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#c2732d';
            ctx.stroke();
            
            ctx.beginPath(); ctx.arc(BOARD_CX, BOARD_CY, 52, 0, 2*Math.PI); ctx.strokeStyle='#b45a2a'; ctx.lineWidth=2.8; ctx.stroke();
            ctx.beginPath(); ctx.arc(BOARD_CX, BOARD_CY, 24, 0, 2*Math.PI); ctx.stroke();
            
            function drawClippedHorizontal(y) {
                let inter1 = intersectHorizontalWithLine(y, diag1);
                let inter2 = intersectHorizontalWithLine(y, diag2);
                if(inter1 && inter2) {
                    let x1 = Math.min(inter1.x, inter2.x);
                    let x2 = Math.max(inter1.x, inter2.x);
                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.stroke();
                }
            }
            function drawClippedVertical(x) {
                let inter1 = intersectVerticalWithLine(x, diag1);
                let inter2 = intersectVerticalWithLine(x, diag2);
                if(inter1 && inter2) {
                    let y1 = Math.min(inter1.y, inter2.y);
                    let y2 = Math.max(inter1.y, inter2.y);
                    ctx.beginPath();
                    ctx.moveTo(x, y1);
                    ctx.lineTo(x, y2);
                    ctx.stroke();
                }
            }
            
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = '#bc6f2c';
            drawClippedHorizontal(BOARD_BOTTOM - BASELINE_OUTER_OFFSET);
            drawClippedHorizontal(BOARD_BOTTOM - BASELINE_INNER_OFFSET);
            drawClippedHorizontal(BOARD_TOP + BASELINE_OUTER_OFFSET);
            drawClippedHorizontal(BOARD_TOP + BASELINE_INNER_OFFSET);
            drawClippedVertical(BOARD_LEFT + BASELINE_OUTER_OFFSET);
            drawClippedVertical(BOARD_LEFT + BASELINE_INNER_OFFSET);
            drawClippedVertical(BOARD_RIGHT - BASELINE_OUTER_OFFSET);
            drawClippedVertical(BOARD_RIGHT - BASELINE_INNER_OFFSET);
            
            let redDots = [];
            let horizYs = [bottomBaselineY, topBaselineY];
            for(let y of horizYs) {
                let inter1 = intersectHorizontalWithLine(y, diag1);
                let inter2 = intersectHorizontalWithLine(y, diag2);
                if(inter1 && inter2) { redDots.push([inter1.x, y]); redDots.push([inter2.x, y]); }
            }
            let vertXs = [BOARD_LEFT+BASELINE_INNER_OFFSET, BOARD_RIGHT-BASELINE_INNER_OFFSET];
            for(let x of vertXs) {
                let inter1 = intersectVerticalWithLine(x, diag1);
                let inter2 = intersectVerticalWithLine(x, diag2);
                if(inter1 && inter2) { redDots.push([x, inter1.y]); redDots.push([x, inter2.y]); }
            }
            ctx.fillStyle = '#E63946';
            for(let pos of redDots) {
                ctx.beginPath(); ctx.arc(pos[0], pos[1], 5, 0, 2*Math.PI); ctx.fill();
            }
        }
        
        function intersectVerticalWithLine(x, line) {
            if (Math.abs(line.x2 - line.x1) < 1e-5) return null;
            let t = (x - line.x1) / (line.x2 - line.x1);
            if (t < 0 || t > 1) return null;
            let y = line.y1 + t * (line.y2 - line.y1);
            return { x, y };
        }
        
        function drawObjects() {
            for(let obj of objects) {
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, obj.radius-1, 0, 2*Math.PI);
                ctx.fillStyle = obj.color;
                ctx.fill();
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 1.6;
                ctx.stroke();
                ctx.fillStyle = '#111';
                ctx.font = 'bold 11px "Segoe UI"';
                ctx.fillText(obj.label, obj.x-5, obj.y+5);
                if(obj.type === 'striker') {
                    ctx.beginPath(); ctx.arc(obj.x, obj.y, 5, 0, 2*Math.PI); ctx.fillStyle = '#FFE484'; ctx.fill();
                }
            }
        }
        
        function drawAimingArrow() {
            if(!strikerObj || isMoving || gameWinner) return;
            // only show arrow when it's human's turn (white in vsAI, or any in twoPlayer)
            if((gameMode === 'vsAI' && currentTurn !== 'white') && gameMode !== 'twoPlayer') return;
            if(gameMode === 'twoPlayer' && currentTurn === 'black') return; // in twoPlayer, only current turn shows arrow? Let both show? Simpler: only show when human can aim: for twoPlayer both can aim when it's their turn.
            let arrowLen = 65;
            let tipX = strikerObj.x + Math.cos(aimAngle) * arrowLen;
            let tipY = strikerObj.y + Math.sin(aimAngle) * arrowLen;
            let pocketPossible = isPocketPossibleFromAngle(aimAngle);
            let arrowColor = pocketPossible ? '#32FF6E' : '#D9A86C';
            ctx.beginPath();
            ctx.moveTo(strikerObj.x, strikerObj.y);
            ctx.lineTo(tipX, tipY);
            ctx.lineWidth = 4;
            ctx.strokeStyle = arrowColor;
            ctx.stroke();
            let wingLen = 11;
            let leftX = tipX + Math.cos(aimAngle - 0.5) * wingLen;
            let leftY = tipY + Math.sin(aimAngle - 0.5) * wingLen;
            let rightX = tipX + Math.cos(aimAngle + 0.5) * wingLen;
            let rightY = tipY + Math.sin(aimAngle + 0.5) * wingLen;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(leftX, leftY);
            ctx.lineTo(rightX, rightY);
            ctx.fillStyle = arrowColor;
            ctx.fill();
        }
        
        function updatePowerMeter() {
            const pmDiv = document.getElementById('powerMeter');
            if(powerDragActive && strikerObj && !isMoving) {
                let pocketPossible = isPocketPossibleFromAngle(aimAngle);
                if(pocketPossible) pmDiv.classList.add('green-active');
                else pmDiv.classList.remove('green-active');
                pmDiv.innerHTML = `🔙 PULL BACK → POWER ${Math.floor(currentPower)}%  ${pocketPossible ? '★ POCKET SHOT' : ''}`;
                pmDiv.style.opacity = '1';
            } else {
                pmDiv.classList.remove('green-active');
                pmDiv.innerHTML = `🔙 PULL BACK → POWER 0%`;
                pmDiv.style.opacity = '0.7';
            }
        }
        
        // ---------- MANUAL TURN HANDLERS (called by buttons) ----------
        function setTurn(turn) {
            if(gameWinner) return;
            if(isMoving) return;
            if(botShootTimer) clearTimeout(botShootTimer);
            // If there is a pending cover and we manually switch turn, queen returns to center
            if(queenPendingCover.active) {
                queenPendingCover.active = false;
                respawnQueen();
            }
            currentTurn = turn;
            waitingForManualTurn = false;
            // remove old striker
            if(strikerObj) {
                const idx = objects.indexOf(strikerObj);
                if(idx !== -1) objects.splice(idx,1);
                strikerObj = null;
            }
            createStriker();
            updateUI();
            // If it's bot's turn in vsAI mode, trigger bot automatically after a short delay
            if(gameMode === 'vsAI' && currentTurn === 'black' && !gameWinner) {
                botShootTimer = setTimeout(() => botAIShoot(), 200);
            }
        }
        
        function humanTurn() { setTurn('white'); }
        function botTurn() { setTurn('black'); }
        function player1Turn() { setTurn('white'); }
        function player2Turn() { setTurn('black'); }
        
        function renderTurnButtons() {
            const container = document.getElementById('turnButtonsContainer');
            container.innerHTML = '';
            if(gameMode === 'twoPlayer') {
                const p1Btn = document.createElement('button');
                p1Btn.innerText = '⚪ PLAYER 1 (WHITE)';
                p1Btn.className = 'action-btn turn-btn';
                p1Btn.onclick = player1Turn;
                const p2Btn = document.createElement('button');
                p2Btn.innerText = '⚫ PLAYER 2 (BLACK)';
                p2Btn.className = 'action-btn turn-btn';
                p2Btn.onclick = player2Turn;
                container.appendChild(p1Btn);
                container.appendChild(p2Btn);
            } else if(gameMode === 'vsAI') {
                const humanBtn = document.createElement('button');
                humanBtn.innerText = '🧑 HUMAN (WHITE)';
                humanBtn.className = 'action-btn turn-btn special';
                humanBtn.onclick = humanTurn;
                const aiBtn = document.createElement('button');
                aiBtn.innerText = '🤖 BOT (BLACK)';
                aiBtn.className = 'action-btn turn-btn';
                aiBtn.onclick = botTurn;
                container.appendChild(humanBtn);
                container.appendChild(aiBtn);
            }
        }
        
        // ---------- INITIAL COINS ----------
        function initBoardCoins() {
            objects = [];
            coinsList = [];
            const centerX = BOARD_CX, centerY = BOARD_CY;
            const innerRad = 26;
            const outerRad = 50;
            let queen = { id:'queen', type:'queen', x:centerX, y:centerY, vx:0, vy:0, radius:COIN_RADIUS, mass:MASS_COIN, color:'#E34234', label:'Q' };
            objects.push(queen); coinsList.push(queen);
            let innerColors = ['white','black','white','black','white','black'];
            for(let i=0;i<6;i++){ let ang=(i*Math.PI*2/6); let x=centerX+Math.cos(ang)*innerRad, y=centerY+Math.sin(ang)*innerRad; let col=innerColors[i]; objects.push({id:`in${i}`,type:col,x,y,vx:0,vy:0,radius:COIN_RADIUS,mass:MASS_COIN,color:col==='white'?'#F5F5DC':'#2F2F2F',label:col==='white'?'W':'B'}); coinsList.push(objects[objects.length-1]); }
            let outerColors = [];
            for(let i=0;i<12;i++) outerColors.push(i%2===0?'white':'black');
            for(let i=0;i<12;i++){ let ang=(i*Math.PI*2/12); let x=centerX+Math.cos(ang)*outerRad, y=centerY+Math.sin(ang)*outerRad; let col=outerColors[i]; objects.push({id:`out${i}`,type:col,x,y,vx:0,vy:0,radius:COIN_RADIUS,mass:MASS_COIN,color:col==='white'?'#F5F5DC':'#2F2F2F',label:col==='white'?'W':'B'}); coinsList.push(objects[objects.length-1]); }
        }
        
        function resetGame() {
            if(animationId) cancelAnimationFrame(animationId);
            objects = []; coinsList = [];
            currentTurn = 'white';
            queenPendingCover = { active: false, player: null };
            gameWinner = null;
            isMoving = false;
            waitingForManualTurn = false;
            powerDragActive = false;
            initBoardCoins();
            createStriker();
            updateUI();
            if(botShootTimer) clearTimeout(botShootTimer);
            startPhysicsLoop();
        }
        
        // ---------- ANIMATION LOOP ----------
        function animate() {
            if(gameWinner) { drawBoardAndMarkings(); drawObjects(); if(!isMoving && !gameWinner) drawAimingArrow(); requestAnimationFrame(animate); return; }
            if(isMoving) {
                applyPhysics();
                let extraTurn = checkPocketingAndGetExtraTurnFlag(currentTurn);
                if(isAllStopped() && isMoving) {
                    isMoving = false;
                    handleTurnEnd(extraTurn);
                }
            }
            drawBoardAndMarkings();
            drawObjects();
            if(!isMoving && !gameWinner) drawAimingArrow();
            requestAnimationFrame(animate);
        }
        
        function startPhysicsLoop() { animate(); }
        
        // ---------- EVENT HANDLERS (power & striker drag) ----------
        function handlePowerStart(e) {
            if(isMoving || gameWinner) return;
            // Only allow human to aim when it's their turn and no waiting for manual turn (i.e., striker exists)
            if(gameMode === 'vsAI' && currentTurn !== 'white') return;
            if(waitingForManualTurn) return;
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (1000/rect.width);
            let my = (e.clientY - rect.top) * (1000/rect.height);
            if(strikerObj && Math.hypot(mx-strikerObj.x, my-strikerObj.y) < STRIKER_RADIUS+10) {
                powerDragActive = true;
                dragOrigin = { x: strikerObj.x, y: strikerObj.y };
                e.preventDefault();
            }
        }
        
        function handlePowerDrag(e) {
            if(!powerDragActive || isMoving) return;
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (1000/rect.width);
            let my = (e.clientY - rect.top) * (1000/rect.height);
            let dx = dragOrigin.x - mx;
            let dy = dragOrigin.y - my;
            let pull = Math.min(32, Math.hypot(dx, dy));
            currentPower = Math.min(40, pull * 1.25);
            aimAngle = Math.atan2(dy, dx);
            updatePowerMeter();
            e.preventDefault();
        }
        
        function handlePowerRelease(e) {
            if(!powerDragActive || isMoving) return;
            if(currentPower > 6) shootStriker(currentPower, aimAngle);
            powerDragActive = false;
            currentPower = 0;
            updatePowerMeter();
        }
        
        function handleMouseMoveAim(e) {
            if(isMoving || gameWinner || powerDragActive) return;
            if(gameMode === 'vsAI' && currentTurn !== 'white') return;
            if(waitingForManualTurn) return;
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (1000/rect.width);
            let my = (e.clientY - rect.top) * (1000/rect.height);
            if(strikerObj) aimAngle = Math.atan2(my - strikerObj.y, mx - strikerObj.x);
        }
        
        function handleDragStriker(e) {
            if(isMoving || gameWinner || powerDragActive) return;
            if(gameMode === 'vsAI' && currentTurn !== 'white') return;
            if(waitingForManualTurn) return;
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (1000/rect.width);
            setStrikerX(mx);
        }
        
        // Mode selection
        function initMode() {
            document.getElementById('twoPlayerModeBtn').onclick = () => {
                gameMode = 'twoPlayer';
                document.getElementById('modeOverlay').style.display = 'none';
                resetGame();
                renderTurnButtons();
            };
            document.getElementById('vsAIModeBtn').onclick = () => {
                gameMode = 'vsAI';
                document.getElementById('modeOverlay').style.display = 'none';
                resetGame();
                renderTurnButtons();
            };
        }
        
        function attachEvents() {
            canvas.addEventListener('mousemove', handleMouseMoveAim);
            canvas.addEventListener('mousedown', handlePowerStart);
            canvas.addEventListener('mousemove', (e) => { if(powerDragActive) handlePowerDrag(e); else handleDragStriker(e); });
            canvas.addEventListener('mouseup', handlePowerRelease);
            canvas.addEventListener('touchmove', (e)=>e.preventDefault());
            canvas.addEventListener('touchstart', (e)=> { let t=e.touches[0]; handlePowerStart(t); });
            canvas.addEventListener('touchmove', (e)=> { let t=e.touches[0]; if(powerDragActive) handlePowerDrag(t); else handleDragStriker(t); e.preventDefault(); });
            canvas.addEventListener('touchend', handlePowerRelease);
            document.getElementById('resetGameBtn').onclick = () => resetGame();
        }
        
        initMode();
        attachEvents();
    })();
</script>
</body>
</html>
