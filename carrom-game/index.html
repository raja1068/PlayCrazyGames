<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Carrom</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Top Ad Placeholder (AdMob/AdSense Banner) -->
    <div id="ad-top" class="ad-container">
        <div class="ad-placeholder">Advertisement</div>
    </div>

    <!-- Game Container -->
    <div id="game-wrapper">
        <!-- Main Menu -->
        <div id="main-menu" class="menu-screen">
            <div class="menu-content">
                <h1 class="game-title">CARROM</h1>
                <div class="menu-buttons">
                    <button id="btn-single-player" class="menu-btn">Single Player vs Bot</button>
                    <button id="btn-two-player" class="menu-btn">Local 2 Player</button>
                </div>
                <div class="game-rules">
                    <h3>Scoring</h3>
                    <p>⚫ Black: +10 | ⚪ White: +20 | 🔴 Queen: +50</p>
                    <p class="rule-note">Queen must be covered by pocketing another coin on the next turn!</p>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <!-- Score Board -->
            <div id="score-board">
                <div id="player1-score" class="player-score active">
                    <span class="player-name">Player 1</span>
                    <span class="score-value">0</span>
                    <span class="coin-indicator">⚫</span>
                </div>
                <div id="turn-indicator">
                    <span id="current-turn">Player 1's Turn</span>
                </div>
                <div id="player2-score" class="player-score">
                    <span class="player-name">Player 2</span>
                    <span class="score-value">0</span>
                    <span class="coin-indicator">⚪</span>
                </div>
            </div>

            <!-- Game Canvas -->
            <div id="canvas-container">
                <canvas id="game-canvas"></canvas>
            </div>

            <!-- Striker Position Slider -->
            <div id="striker-controls">
                <input type="range" id="striker-slider" min="0" max="100" value="50">
                <span id="slider-label">Position Striker</span>
            </div>

            <!-- Game Messages -->
            <div id="game-message" class="hidden">
                <span id="message-text"></span>
            </div>

            <!-- Pause/Menu Button -->
            <button id="btn-pause" class="control-btn">☰</button>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="menu-screen hidden">
            <div class="menu-content">
                <h2>Paused</h2>
                <div class="menu-buttons">
                    <button id="btn-resume" class="menu-btn">Resume</button>
                    <button id="btn-restart" class="menu-btn">Restart</button>
                    <button id="btn-main-menu" class="menu-btn">Main Menu</button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="menu-screen hidden">
            <div class="menu-content">
                <h2 id="winner-text">Player 1 Wins!</h2>
                <div id="final-scores">
                    <p>Player 1: <span id="final-score-1">0</span></p>
                    <p>Player 2: <span id="final-score-2">0</span></p>
                </div>
                <div class="menu-buttons">
                    <button id="btn-play-again" class="menu-btn">Play Again</button>
                    <button id="btn-back-menu" class="menu-btn">Main Menu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Ad Placeholder (AdMob/AdSense Banner) -->
    <div id="ad-bottom" class="ad-container">
        <div class="ad-placeholder">Advertisement</div>
    </div>

    <!-- Matter.js CDN -->
    <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js)"></script>
    
    <!-- Game Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/board.js"></script>
    <script src="js/coins.js"></script>
    <script src="js/striker.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/bot.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
