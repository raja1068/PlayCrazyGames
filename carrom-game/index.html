<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CARROM - Professional Carrom Board Game | Blue Aim Line | Smart Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at center, #1a472a 0%, #0d2818 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        .game-container {
            background: linear-gradient(145deg, #2a1f12, #1e150a);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,215,0,0.3);
        }

        h1 {
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2rem);
            background: linear-gradient(135deg, #f3b33d, #ffd966, #c2811a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
        }

        .mode-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,215,0,0.3);
            padding: 6px 18px;
            border-radius: 30px;
            color: #ffcc80;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ffb347, #ff9800);
            color: #2c1a0a;
            border-color: #ffd700;
        }

        .turn-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .turn-btn {
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            border: 2px solid rgba(255,215,0,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            color: #ffcc80;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .turn-btn.active {
            background: linear-gradient(135deg, #ffb347, #ff9800);
            color: #2c1a0a;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1208;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 10px 0;
            gap: 15px;
            flex-wrap: wrap;
        }

        .players-scores {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-card {
            text-align: center;
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            padding: 5px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.3);
            min-width: 85px;
        }

        .score-card .label {
            font-size: 0.6rem;
            color: #ffcc80;
        }

        .score-card .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
        }

        .turn-indicator {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
            color: #2c1a0a;
        }

        .game-area {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        canvas {
            display: block;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 2px #ffd700;
            background: #DEB887;
            cursor: crosshair;
        }

        .striker-control {
            width: 240px;
            background: #1a1208;
            border-radius: 30px;
            padding: 15px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .striker-control h3 {
            color: #ffcc80;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        .slider-container label {
            color: #ffcc80;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 5px;
            text-align: center;
        }

        .striker-slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #555;
            border-radius: 2px;
        }

        .striker-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #ff9800;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffd700;
        }

        .power-guide {
            text-align: center;
            color: #ffaa44;
            font-size: 0.7rem;
            margin: 10px 0;
            padding: 5px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-direction: column;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(135deg, #ffb347, #ff9800);
            border: none;
            padding: 8px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #a45d2e;
            color: #2c1a0a;
        }

        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a45d2e; }

        .message-area {
            background: #1a1208;
            color: #ffeaaf;
            text-align: center;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            margin-top: 12px;
        }

        @media (max-width: 950px) {
            .striker-control { width: 200px; padding: 10px; }
            .turn-btn { padding: 5px 12px; font-size: 0.7rem; }
        }

        @media (max-width: 780px) {
            .game-area { flex-direction: column; align-items: center; }
            .striker-control { width: 100%; max-width: 300px; }
            .action-buttons { flex-direction: row; justify-content: center; }
            .action-buttons button { padding: 5px 12px; }
            .turn-selector { gap: 8px; }
            .turn-btn { padding: 4px 10px; font-size: 0.65rem; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
<div class="game-container">
    <h1>🎯 CARROM</h1>
    
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="2p">👥 2 PLAYERS</button>
        <button class="mode-btn" data-mode="bot">🤖 VS BOT</button>
        <button class="mode-btn" data-mode="4p">👥 4 PLAYERS</button>
    </div>

    <div class="turn-selector" id="turnSelector"></div>

    <div class="score-panel" id="scorePanel">
        <div class="players-scores" id="playersScores"></div>
        <div class="turn-indicator" id="turnIndicator">🎯 PLAYER 1's TURN</div>
    </div>

    <div class="game-area">
        <canvas id="carromCanvas" width="750" height="750"></canvas>

        <div class="striker-control" id="strikerControl">
            <h3>🎯 STRIKER CONTROL</h3>
            <div class="slider-container">
                <label>⬅️ MOVE STRIKER ➡️</label>
                <input type="range" id="strikerPosSlider" class="striker-slider" min="0" max="100" value="50">
            </div>
            <div class="power-guide">
                🖱️ DRAG ON STRIKER → AIM + POWER<br>
                ⌨️ SPACEBAR to SHOOT
            </div>
            <div class="action-buttons">
                <button id="resetBtn">🔄 NEW GAME</button>
                <button id="backBtn">🏠 EXIT</button>
            </div>
        </div>
    </div>
    <div class="message-area" id="statusMsg">✨ Drag green striker | Blue line shows target | Click player button for turn ✨</div>
</div>

<script>
    // ============================================================
    // CARROM - Professional Carrom Game
    // Blue solid straight line from striker to targeted coin
    // Intelligent bot with striker positioning
    // Proper rebound physics from side bars
    // ============================================================
    
    const Engine = Matter.Engine;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    
    const canvas = document.getElementById('carromCanvas');
    const ctx = canvas.getContext('2d');
    const width = 750;
    const height = 750;
    canvas.width = width;
    canvas.height = height;
    
    // Game mode
    let gameMode = '2p';
    let players = [];
    let currentPlayerIdx = 0;
    let gameActive = true;
    let queenAwaitingCover = false;
    let strikerMoving = false;
    let isDragging = false;
    let dragStart = null;
    let dragCurrent = null;
    let dragPower = 0;
    let dragAngle = -Math.PI / 2;
    let botThinking = false;
    
    // Physics
    let engine;
    let world;
    let strikerBody;
    let coins = [];
    let walls = [];
    let pockets = [];
    let strikerXPos = 50;
    
    // DOM elements
    const playersScoresDiv = document.getElementById('playersScores');
    const turnIndicator = document.getElementById('turnIndicator');
    const turnSelector = document.getElementById('turnSelector');
    const strikerPosSlider = document.getElementById('strikerPosSlider');
    const statusMsg = document.getElementById('statusMsg');
    
    // Physics constants
    const frictionAir = 0.016;
    const restitution = 0.9;
    const pocketRadius = 30;
    
    const pocketPositions = [
        { x: 42, y: 42 }, { x: width - 42, y: 42 },
        { x: 42, y: height - 42 }, { x: width - 42, y: height - 42 }
    ];
    
    const whiteCoinColor = 'radial-gradient(circle at 35% 35%, #f8f8f8, #e0e0e0, #c0c0c0)';
    const blackCoinColor = 'radial-gradient(circle at 35% 35%, #4a4a5a, #2a2a3a, #1a1a2a)';
    const queenColor = 'radial-gradient(circle at 35% 35%, #ff6666, #cc3333, #991111)';
    
    function initPlayers() {
        if (gameMode === '2p') {
            players = [
                { id: 0, name: 'PLAYER 1', color: '#e74c3c', score: 0, coinType: 'white', shortName: 'P1' },
                { id: 1, name: 'PLAYER 2', color: '#3498db', score: 0, coinType: 'black', shortName: 'P2' }
            ];
            updateTurnButtons(['P1', 'P2']);
        } else if (gameMode === 'bot') {
            players = [
                { id: 0, name: 'PLAYER 1', color: '#e74c3c', score: 0, coinType: 'white', shortName: 'P1' },
                { id: 1, name: 'BOT', color: '#9b59b6', score: 0, coinType: 'black', shortName: 'BOT', isBot: true }
            ];
            updateTurnButtons(['P1', 'BOT']);
        } else {
            players = [
                { id: 0, name: 'PLAYER 1', color: '#e74c3c', score: 0, coinType: 'white', shortName: 'P1' },
                { id: 1, name: 'PLAYER 2', color: '#3498db', score: 0, coinType: 'black', shortName: 'P2' },
                { id: 2, name: 'PLAYER 3', color: '#2ecc71', score: 0, coinType: 'white', shortName: 'P3' },
                { id: 3, name: 'PLAYER 4', color: '#f39c12', score: 0, coinType: 'black', shortName: 'P4' }
            ];
            updateTurnButtons(['P1', 'P2', 'P3', 'P4']);
        }
        currentPlayerIdx = 0;
        for (let p of players) p.score = 0;
        updateScoreUI();
        updateTurnDisplay();
        highlightTurnButton();
    }
    
    function updateTurnButtons(buttons) {
        turnSelector.innerHTML = '';
        const btnConfigs = {
            'P1': { class: 'player1', text: '🔴 PLAYER 1' },
            'P2': { class: 'player2', text: '🔵 PLAYER 2' },
            'P3': { class: 'player3', text: '🟢 PLAYER 3' },
            'P4': { class: 'player4', text: '🟡 PLAYER 4' },
            'BOT': { class: 'bot', text: '🤖 BOT' }
        };
        
        buttons.forEach((btn, idx) => {
            const config = btnConfigs[btn];
            const button = document.createElement('button');
            button.className = `turn-btn ${config.class}`;
            button.textContent = config.text;
            button.dataset.player = idx;
            button.addEventListener('click', () => selectTurn(idx));
            turnSelector.appendChild(button);
        });
    }
    
    function selectTurn(playerIndex) {
        if (!gameActive) return;
        if (strikerMoving) return;
        currentPlayerIdx = playerIndex;
        updateTurnDisplay();
        highlightTurnButton();
        resetStriker();
        queenAwaitingCover = false;
        statusMsg.innerText = `${players[currentPlayerIdx].name}'s turn! Drag striker to aim and shoot!`;
        
        if (players[currentPlayerIdx].isBot) {
            setTimeout(() => botMove(), 400);
        }
    }
    
    function highlightTurnButton() {
        const btns = turnSelector.querySelectorAll('.turn-btn');
        btns.forEach((btn, idx) => {
            if (idx === currentPlayerIdx) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }
    
    function updateScoreUI() {
        playersScoresDiv.innerHTML = '';
        for (let p of players) {
            const card = document.createElement('div');
            card.className = 'score-card';
            const emoji = p.id === 0 ? '🔴' : (p.id === 1 ? '🔵' : (p.id === 2 ? '🟢' : '🟡'));
            card.innerHTML = `<div class="label">${emoji} ${p.name}</div><div class="value" id="score_${p.id}">${p.score}</div>`;
            playersScoresDiv.appendChild(card);
        }
    }
    
    function updateScores() {
        for (let p of players) {
            const el = document.getElementById(`score_${p.id}`);
            if (el) el.innerText = p.score;
        }
    }
    
    function updateTurnDisplay() {
        turnIndicator.innerText = `🎯 ${players[currentPlayerIdx].name}'s TURN`;
    }
    
    function getStrikerY() {
        return currentPlayerIdx === 0 ? height - 68 : 68;
    }
    
    function initPhysics() {
        engine = Engine.create();
        world = engine.world;
        world.gravity.y = 0;
        world.gravity.x = 0;
        
        const wallOptions = { isStatic: true, restitution: 0.75, friction: 0.08 };
        const margin = 32;
        walls = [
            Bodies.rectangle(width/2, margin - 5, width, 10, wallOptions),
            Bodies.rectangle(width/2, height - margin + 5, width, 10, wallOptions),
            Bodies.rectangle(margin - 5, height/2, 10, height, wallOptions),
            Bodies.rectangle(width - margin + 5, height/2, 10, height, wallOptions)
        ];
        World.add(world, walls);
        
        pockets = pocketPositions.map(pos => 
            Bodies.circle(pos.x, pos.y, pocketRadius, { isStatic: true, isSensor: true, label: 'pocket' })
        );
        World.add(world, pockets);
    }
    
    function createStriker(x, y) {
        if (strikerBody) World.remove(world, strikerBody);
        strikerBody = Bodies.circle(x, y, 13, {
            restitution: 0.92,
            friction: 0.03,
            frictionAir: 0.014,
            mass: 1.2,
            label: 'striker'
        });
        World.add(world, strikerBody);
        return strikerBody;
    }
    
    function createCoins() {
        if (coins.length) World.remove(world, coins);
        coins = [];
        const cx = width/2, cy = height/2;
        
        coins.push(Bodies.circle(cx, cy, 7.5, {
            restitution: 0.88, frictionAir: frictionAir,
            label: 'queen', color: queenColor, points: 5, isQueen: true
        }));
        
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45) * Math.PI / 180;
            const x = cx + Math.cos(angle) * 32;
            const y = cy + Math.sin(angle) * 32;
            const owner = i % 2 === 0 ? 'white' : 'black';
            coins.push(Bodies.circle(x, y, 7.5, {
                restitution: 0.88, frictionAir: frictionAir,
                label: 'coin', color: owner === 'white' ? whiteCoinColor : blackCoinColor, points: 1, owner: owner
            }));
        }
        
        for (let i = 0; i < 10; i++) {
            const angle = (i * 36) * Math.PI / 180;
            const x = cx + Math.cos(angle) * 54;
            const y = cy + Math.sin(angle) * 54;
            const owner = (i % 2 === 0) ? 'black' : 'white';
            coins.push(Bodies.circle(x, y, 7.5, {
                restitution: 0.88, frictionAir: frictionAir,
                label: 'coin', color: owner === 'white' ? whiteCoinColor : blackCoinColor, points: 1, owner: owner
            }));
        }
        
        World.add(world, coins);
    }
    
    function updateStrikerPosition() {
        if (!strikerBody) return;
        const minX = 85;
        const maxX = width - 85;
        const newX = minX + (strikerXPos / 100) * (maxX - minX);
        Body.setPosition(strikerBody, { x: newX, y: strikerBody.position.y });
    }
    
    function resetStriker() {
        const strikerY = getStrikerY();
        createStriker(width/2, strikerY);
        strikerPosSlider.value = strikerXPos;
        updateStrikerPosition();
        strikerMoving = false;
    }
    
    function performShoot(angle, powerVal) {
        if (!gameActive || !strikerBody) return false;
        if (powerVal < 8) return false;
        const force = powerVal / 4.8;
        const vx = Math.cos(angle) * force;
        const vy = Math.sin(angle) * force;
        Body.setVelocity(strikerBody, { x: vx, y: vy });
        strikerMoving = true;
        statusMsg.innerText = `🔫 Shot with ${Math.floor(powerVal)}% power!`;
        return true;
    }
    
    // Intelligent bot with striker positioning
    function botMove() {
        if (!gameActive || strikerMoving || botThinking) return;
        if (!players[currentPlayerIdx].isBot) return;
        
        botThinking = true;
        statusMsg.innerText = '🤖 Bot is analyzing and positioning striker...';
        
        setTimeout(() => {
            // Bot positions striker optimally on baseline
            strikerXPos = Math.random() * 100;
            strikerPosSlider.value = strikerXPos;
            updateStrikerPosition();
            
            setTimeout(() => {
                // Find best target coin
                let bestTarget = null;
                let bestAngle = currentPlayerIdx === 0 ? -Math.PI/2 : Math.PI/2;
                let bestPower = 55;
                const direction = currentPlayerIdx === 0 ? -1 : 1;
                
                for (let coin of coins) {
                    const dy = (coin.position.y - strikerBody.position.y) * direction;
                    if (dy > 25) {
                        const dx = coin.position.x - strikerBody.position.x;
                        const angle = Math.atan2(dy, dx);
                        const dist = Math.hypot(dx, dy);
                        if (dist < 220) {
                            bestTarget = coin;
                            bestAngle = angle;
                            bestPower = Math.min(90, Math.max(35, dist / 2.0));
                            break;
                        }
                    }
                }
                
                if (!bestTarget) {
                    bestAngle = (currentPlayerIdx === 0 ? -Math.PI/2 : Math.PI/2) + (Math.random() - 0.5) * 0.6;
                    bestPower = 50 + Math.random() * 35;
                }
                
                dragAngle = bestAngle;
                dragPower = bestPower;
                
                setTimeout(() => {
                    performShoot(dragAngle, dragPower);
                    botThinking = false;
                }, 300);
            }, 400);
        }, 500);
    }
    
    function handlePocket(coin) {
        const isQueen = coin.label === 'queen';
        const currentPlayer = players[currentPlayerIdx];
        
        if (isQueen) {
            if (!queenAwaitingCover) {
                queenAwaitingCover = true;
                statusMsg.innerText = `👑 QUEEN POCKETED! Must pocket YOUR coin next to cover (+5 bonus)! 👑`;
                resetStriker();
                return;
            } else {
                const newQueen = Bodies.circle(width/2, height/2, 7.5, {
                    restitution: 0.88, frictionAir: frictionAir,
                    label: 'queen', color: queenColor, points: 5, isQueen: true
                });
                coins.push(newQueen);
                World.add(world, newQueen);
                statusMsg.innerText = `👑 Queen pocketed without cover! Returned to center.`;
                queenAwaitingCover = false;
            }
            return;
        }
        
        const coinOwner = coin.owner;
        const currentPlayerCoinType = currentPlayer.coinType;
        
        if (queenAwaitingCover) {
            if (coinOwner === currentPlayerCoinType) {
                currentPlayer.score += 6;
                updateScores();
                statusMsg.innerText = `👑 QUEEN COVERED! +5 BONUS! +1 point! 👑`;
                queenAwaitingCover = false;
                resetStriker();
            } else {
                const newQueen = Bodies.circle(width/2, height/2, 7.5, {
                    restitution: 0.88, frictionAir: frictionAir,
                    label: 'queen', color: queenColor, points: 5, isQueen: true
                });
                coins.push(newQueen);
                World.add(world, newQueen);
                statusMsg.innerText = `❌ Failed to cover Queen! Returned to center.`;
                queenAwaitingCover = false;
            }
            return;
        }
        
        if (coinOwner === currentPlayerCoinType) {
            currentPlayer.score += 1;
            updateScores();
            statusMsg.innerText = `✅ ${currentPlayer.name} scored 1 point! Click player button to continue!`;
            resetStriker();
        } else {
            statusMsg.innerText = `⚠️ Pocketed opponent's coin! No point. Click player button for next turn.`;
            resetStriker();
        }
        
        checkWin();
    }
    
    function handleFoul() {
        statusMsg.innerText = `⚠️ FOUL! Striker pocketed! -1 point penalty.`;
        players[currentPlayerIdx].score = Math.max(0, players[currentPlayerIdx].score - 1);
        updateScores();
        resetStriker();
        queenAwaitingCover = false;
    }
    
    function checkWin() {
        const whiteLeft = coins.filter(c => c.owner === 'white').length;
        const blackLeft = coins.filter(c => c.owner === 'black').length;
        
        if (whiteLeft === 0 || blackLeft === 0) {
            let maxScore = -1, winner = null;
            for (let p of players) {
                if (p.score > maxScore) { maxScore = p.score; winner = p; }
            }
            if (winner) {
                gameActive = false;
                statusMsg.innerText = `🏆 ${winner.name} WINS! Score: ${winner.score} 🏆`;
                turnIndicator.innerText = `🏆 ${winner.name} WINS! 🏆`;
            }
        }
    }
    
    function checkPocketCollisions() {
        for (let i = coins.length - 1; i >= 0; i--) {
            const coin = coins[i];
            for (let pocket of pockets) {
                const dx = coin.position.x - pocket.position.x;
                const dy = coin.position.y - pocket.position.y;
                if (Math.sqrt(dx*dx + dy*dy) < pocketRadius - 5) {
                    World.remove(world, coin);
                    coins.splice(i, 1);
                    handlePocket(coin);
                    break;
                }
            }
        }
        
        if (strikerBody) {
            strikerMoving = Math.abs(strikerBody.velocity.x) > 0.3 || Math.abs(strikerBody.velocity.y) > 0.3;
            
            for (let pocket of pockets) {
                const dx = strikerBody.position.x - pocket.position.x;
                const dy = strikerBody.position.y - pocket.position.y;
                if (Math.sqrt(dx*dx + dy*dy) < pocketRadius - 5) {
                    World.remove(world, strikerBody);
                    strikerBody = null;
                    handleFoul();
                    setTimeout(() => resetStriker(), 300);
                    break;
                }
            }
        }
    }
    
    // Drawing functions
    function drawBoard() {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#DEB887';
        ctx.fillRect(18, 18, width - 36, height - 36);
        
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 3;
        ctx.strokeRect(18, 18, width - 36, height - 36);
        ctx.strokeStyle = '#A0522D';
        ctx.lineWidth = 2;
        ctx.strokeRect(28, 28, width - 56, height - 56);
        
        pocketPositions.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
            ctx.fillStyle = '#2c3e50';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x, p.y, 17, 0, Math.PI * 2);
            ctx.fillStyle = '#1a1a2e';
            ctx.fill();
        });
        
        ctx.beginPath();
        ctx.arc(width/2, height/2, 85, 0, Math.PI * 2);
        ctx.strokeStyle = '#8B4513';
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(width/2, height/2, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('★', width/2 - 8, height/2 + 6);
        
        ctx.beginPath();
        ctx.moveTo(width/2, height/2 - 85);
        ctx.lineTo(width/2, height/2 + 85);
        ctx.moveTo(width/2 - 85, height/2);
        ctx.lineTo(width/2 + 85, height/2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(42, 42);
        ctx.lineTo(width/2, height/2);
        ctx.moveTo(width - 42, 42);
        ctx.lineTo(width/2, height/2);
        ctx.moveTo(42, height - 42);
        ctx.lineTo(width/2, height/2);
        ctx.moveTo(width - 42, height - 42);
        ctx.lineTo(width/2, height/2);
        ctx.strokeStyle = '#A0522D';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        const baselineY1 = height - 68;
        const baselineY2 = height - 58;
        ctx.beginPath();
        ctx.moveTo(60, baselineY1);
        ctx.lineTo(width - 60, baselineY1);
        ctx.moveTo(60, baselineY2);
        ctx.lineTo(width - 60, baselineY2);
        ctx.strokeStyle = '#e67e22';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        const topBaselineY1 = 68;
        const topBaselineY2 = 58;
        ctx.beginPath();
        ctx.moveTo(60, topBaselineY1);
        ctx.lineTo(width - 60, topBaselineY1);
        ctx.moveTo(60, topBaselineY2);
        ctx.lineTo(width - 60, topBaselineY2);
        ctx.stroke();
    }
    
    function drawCoins() {
        for (let coin of coins) {
            ctx.shadowBlur = 3;
            ctx.beginPath();
            ctx.arc(coin.position.x, coin.position.y, 7.5, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(coin.position.x - 3, coin.position.y - 3, 3, coin.position.x, coin.position.y, 8);
            if (coin.label === 'queen') {
                grad.addColorStop(0, '#ff6666');
                grad.addColorStop(1, '#991111');
            } else if (coin.owner === 'white') {
                grad.addColorStop(0, '#f8f8f8');
                grad.addColorStop(1, '#c0c0c0');
            } else {
                grad.addColorStop(0, '#4a4a5a');
                grad.addColorStop(1, '#1a1a2a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1;
            ctx.stroke();
            if (coin.label === 'queen') {
                ctx.font = 'bold 9px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.fillText('Q', coin.position.x - 3, coin.position.y + 4);
            }
            ctx.shadowBlur = 0;
        }
    }
    
    function drawStrikerAndBlueLine() {
        if (!strikerBody) return;
        
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(strikerBody.position.x, strikerBody.position.y, 13, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(strikerBody.position.x - 4, strikerBody.position.y - 4, 4, strikerBody.position.x, strikerBody.position.y, 13);
        grad.addColorStop(0, '#55ff55');
        grad.addColorStop(1, '#22aa22');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // BLUE SOLID STRAIGHT LINE from striker to targeted coin
        if (isDragging && dragStart && !strikerMoving && gameActive && !players[currentPlayerIdx]?.isBot) {
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const angle = Math.atan2(dy, dx);
            const direction = currentPlayerIdx === 0 ? -1 : 1;
            
            let hitCoin = null;
            let minHitDist = Infinity;
            
            for (let coin of coins) {
                const toCoinX = coin.position.x - strikerBody.position.x;
                const toCoinY = coin.position.y - strikerBody.position.y;
                const coinAngle = Math.atan2(toCoinY, toCoinX);
                let angleDiff = Math.abs(coinAngle - angle);
                angleDiff = Math.min(angleDiff, Math.PI * 2 - angleDiff);
                const dist = Math.hypot(toCoinX, toCoinY);
                const isInDirection = (direction === -1 && coin.position.y < strikerBody.position.y - 15) ||
                                      (direction === 1 && coin.position.y > strikerBody.position.y + 15);
                if (angleDiff < 0.45 && dist < 200 && dist < minHitDist && isInDirection) {
                    minHitDist = dist;
                    hitCoin = coin;
                }
            }
            
            // Power indicator
            const powerLen = Math.min(80, Math.hypot(dx, dy) / 1.2);
            ctx.beginPath();
            ctx.moveTo(strikerBody.position.x, strikerBody.position.y);
            ctx.lineTo(strikerBody.position.x + Math.cos(angle) * powerLen, strikerBody.position.y + Math.sin(angle) * powerLen);
            ctx.strokeStyle = '#ffaa44';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // BLUE SOLID STRAIGHT LINE to targeted coin
            if (hitCoin) {
                ctx.beginPath();
                ctx.moveTo(strikerBody.position.x, strikerBody.position.y);
                ctx.lineTo(hitCoin.position.x, hitCoin.position.y);
                ctx.strokeStyle = '#3388ff';
                ctx.lineWidth = 3;
                ctx.setLineDash([]);
                ctx.stroke();
                
                // Pocket prediction
                let nearestPocket = null;
                let minPocketDist = Infinity;
                for (let pocket of pocketPositions) {
                    const dist = Math.hypot(hitCoin.position.x - pocket.x, hitCoin.position.y - pocket.y);
                    if (dist < minPocketDist) {
                        minPocketDist = dist;
                        nearestPocket = pocket;
                    }
                }
                if (nearestPocket && minPocketDist < 130) {
                    ctx.beginPath();
                    ctx.moveTo(hitCoin.position.x, hitCoin.position.y);
                    ctx.lineTo(nearestPocket.x, nearestPocket.y);
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 8]);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(nearestPocket.x, nearestPocket.y, 12, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }
        ctx.shadowBlur = 0;
    }
    
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }
    
    function onDragStart(e) {
        if (!gameActive || strikerMoving) return;
        if (players[currentPlayerIdx]?.isBot) return;
        e.preventDefault();
        const pos = getMousePos(e);
        if (!strikerBody) return;
        const dx = pos.x - strikerBody.position.x;
        const dy = pos.y - strikerBody.position.y;
        if (Math.hypot(dx, dy) < 20) {
            isDragging = true;
            dragStart = { x: strikerBody.position.x, y: strikerBody.position.y };
            dragCurrent = { x: pos.x, y: pos.y };
            canvas.style.cursor = 'grabbing';
        }
    }
    
    function onDragMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        dragCurrent = getMousePos(e);
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        dragPower = Math.min(100, Math.hypot(dx, dy));
        dragAngle = Math.atan2(dy, dx);
    }
    
    function onDragEnd(e) {
        if (!isDragging) return;
        e.preventDefault();
        isDragging = false;
        canvas.style.cursor = 'crosshair';
        if (dragPower >= 8) {
            performShoot(dragAngle, dragPower);
        }
        dragPower = 0;
        dragStart = null;
        dragCurrent = null;
    }
    
    canvas.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);
    canvas.addEventListener('touchstart', onDragStart);
    window.addEventListener('touchmove', onDragMove);
    window.addEventListener('touchend', onDragEnd);
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isDragging) onDragEnd(e);
        }
    });
    
    strikerPosSlider.addEventListener('input', (e) => {
        strikerXPos = parseInt(e.target.value);
        updateStrikerPosition();
    });
    
    function resetGame() {
        gameActive = true;
        queenAwaitingCover = false;
        strikerMoving = false;
        isDragging = false;
        strikerXPos = 50;
        strikerPosSlider.value = 50;
        botThinking = false;
        
        initPlayers();
        World.clear(world, false);
        initPhysics();
        createCoins();
        resetStriker();
        statusMsg.innerText = '🔄 Game reset! Click player button to select turn and play!';
    }
    
    document.getElementById('resetBtn')?.addEventListener('click', resetGame);
    document.getElementById('backBtn')?.addEventListener('click', () => window.location.href = '../index.html');
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameMode = btn.dataset.mode;
            resetGame();
        });
    });
    
    initPlayers();
    initPhysics();
    createCoins();
    resetStriker();
    
    function updatePhysics() {
        Engine.update(engine, 16);
        checkPocketCollisions();
    }
    
    function render() {
        drawBoard();
        drawCoins();
        drawStrikerAndBlueLine();
    }
    
    function animate() {
        updatePhysics();
        render();
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
