<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders Premium</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --p1-color: #ffd700;
            --p2-color: #e0e0e0;
            --cell-size: 60px;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }

        /* UI Elements */
        .header {
            margin: 20px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .game-container {
            position: relative;
            padding: 15px;
            background: linear-gradient(145deg, #2c2c2c, #000);
            border: 4px solid var(--gold);
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 20px rgba(212,175,55,0.2);
            border-radius: 8px;
        }

        /* The Board */
        #board {
            display: grid;
            grid-template-columns: repeat(10, var(--cell-size));
            grid-template-rows: repeat(10, var(--cell-size));
            background: #222;
            position: relative;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 0.5px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: rgba(255,255,255,0.3);
            position: relative;
        }

        /* ZigZag Coloring */
        .cell:nth-child(even) { background: rgba(255,255,255,0.02); }

        /* Players */
        .player {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: absolute;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #p1 { background: radial-gradient(circle at 30% 30%, #fff, var(--p1-color)); border: 2px solid gold; }
        #p2 { background: radial-gradient(circle at 30% 30%, #fff, var(--p2-color)); border: 2px solid #999; }

        /* 3D Dice */
        .dice-area {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .scene {
            width: 60px;
            height: 60px;
            perspective: 600px;
        }

        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s ease-out;
        }

        .dice-face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 5px;
            box-sizing: border-box;
        }

        .dot { background: #333; border-radius: 50%; margin: 2px; }

        /* Dice Transforms */
        .face-1 { transform: rotateY(0deg) translateZ(30px); }
        .face-2 { transform: rotateY(180deg) translateZ(30px); }
        .face-3 { transform: rotateY(90deg) translateZ(30px); }
        .face-4 { transform: rotateY(-90deg) translateZ(30px); }
        .face-5 { transform: rotateX(90deg) translateZ(30px); }
        .face-6 { transform: rotateX(-90deg) translateZ(30px); }

        /* Controls UI */
        .panel {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            min-width: 200px;
        }

        button {
            background: linear-gradient(to bottom, var(--gold), #b8860b);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .active-turn {
            box-shadow: 0 0 20px var(--gold);
            border: 2px solid var(--gold);
        }

        /* Connectors (Snakes/Ladders) */
        .connector {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            transform-origin: center left;
        }
        
        .ladder {
            background: repeating-linear-gradient(90deg, #3d2b1f 0px, #3d2b1f 5px, transparent 5px, transparent 20px),
                        linear-gradient(to bottom, #5d4037, #3d2b1f);
            height: 20px;
            opacity: 0.8;
            border-left: 5px solid #2a1b10;
            border-right: 5px solid #2a1b10;
        }

        .snake {
            height: 12px;
            background: linear-gradient(90deg, #008080, #ffd700);
            border-radius: 10px;
            opacity: 0.7;
            box-shadow: 0 0 10px rgba(0,128,128,0.5);
        }

        @media (max-width: 600px) {
            :root { --cell-size: 35px; }
            .player { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>

    <h1 class="header">Snakes & Ladders Premium</h1>

    <div class="game-container">
        <div id="board"></div>
        <div id="p1" class="player"></div>
        <div id="p2" class="player"></div>
    </div>

    <div class="dice-area">
        <div class="panel" id="p1-panel">
            <h3>Player 1</h3>
            <p id="p1-pos">Position: 1</p>
        </div>

        <div class="scene">
            <div class="dice" id="dice">
                <div class="dice-face face-1"><div></div><div class="dot"></div></div>
                <div class="dice-face face-2"><div class="dot"></div><div></div><div></div><div></div><div></div><div class="dot"></div></div>
                <div class="dice-face face-3"><div class="dot"></div><div></div><div></div><div class="dot"></div><div></div><div></div><div class="dot"></div></div>
                <div class="dice-face face-4"><div class="dot"></div><div></div><div class="dot"></div><div></div><div></div><div></div><div class="dot"></div><div></div><div class="dot"></div></div>
                <div class="dice-face face-5"><div class="dot"></div><div></div><div class="dot"></div><div></div><div class="dot"></div><div></div><div class="dot"></div><div></div><div class="dot"></div></div>
                <div class="dice-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div></div><div></div><div></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
        </div>

        <div class="panel" id="p2-panel">
            <h3>Player 2</h3>
            <p id="p2-pos">Position: 1</p>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button id="roll-btn" onclick="playTurn()">Roll Dice</button>
        <p id="status" style="text-align: center; margin-top: 10px; color: var(--gold);"></p>
    </div>

    <script>
        const board = document.getElementById('board');
        const status = document.getElementById('status');
        const ladders = { 3: 77, 7: 53, 15: 96, 21: 98, 54: 88 };
        const snakes = { 99: 5, 94: 66, 70: 51, 57: 25, 45: 13 };
        
        let players = [
            { id: 'p1', pos: 1, color: 'Gold' },
            { id: 'p2', pos: 1, color: 'Silver' }
        ];
        let turn = 0;
        let isRolling = false;

        // 1. Build Board Architecture
        function createBoard() {
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 10; col++) {
                    let cellNum;
                    if (row % 2 === 0) {
                        cellNum = (row * 10) + (col + 1);
                    } else {
                        cellNum = (row * 10) + (10 - col);
                    }
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = 'cell-' + cellNum;
                    cell.innerHTML = `<span>${cellNum}</span>`;
                    board.appendChild(cell);
                }
            }
            // Draw visual connectors
            Object.keys(ladders).forEach(start => drawConnector(start, ladders[start], 'ladder'));
            Object.keys(snakes).forEach(start => drawConnector(start, snakes[start], 'snake'));
            updatePlayerPos(0);
            updatePlayerPos(1);
            updateUI();
        }

        function drawConnector(start, end, type) {
            const startEl = document.getElementById('cell-' + start);
            const endEl = document.getElementById('cell-' + end);
            const rectS = startEl.getBoundingClientRect();
            const rectE = endEl.getBoundingClientRect();
            const boardRect = board.getBoundingClientRect();

            const x1 = (rectS.left + rectS.width/2) - boardRect.left;
            const y1 = (rectS.top + rectS.height/2) - boardRect.top;
            const x2 = (rectE.left + rectE.width/2) - boardRect.left;
            const y2 = (rectE.top + rectE.height/2) - boardRect.top;

            const dist = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

            const line = document.createElement('div');
            line.className = `connector ${type}`;
            line.style.width = dist + 'px';
            line.style.left = x1 + 'px';
            line.style.top = y1 + 'px';
            line.style.transform = `rotate(${angle}deg)`;
            board.appendChild(line);
        }

        // 2. Gameplay Mechanics
        async function playTurn() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('roll-btn').disabled = true;

            const roll = Math.floor(Math.random() * 6) + 1;
            await animateDice(roll);

            let p = players[turn];
            let newPos = p.pos + roll;

            if (newPos <= 100) {
                p.pos = newPos;
                updatePlayerPos(turn);
                
                // Check Snakes/Ladders
                await new Promise(r => setTimeout(r, 600));
                if (ladders[p.pos]) {
                    status.innerText = "Climbing a ladder!";
                    p.pos = ladders[p.pos];
                } else if (snakes[p.pos]) {
                    status.innerText = "Oh no, a snake!";
                    p.pos = snakes[p.pos];
                }
                updatePlayerPos(turn);
            } else {
                status.innerText = "Roll too high! Stay put.";
            }

            if (p.pos === 100) {
                status.innerText = `PLAYER ${turn + 1} WINS!`;
                return;
            }

            // Bonus turn logic
            if (roll !== 6) {
                turn = (turn + 1) % 2;
            } else {
                status.innerText = "Rolled a 6! Extra turn!";
            }

            updateUI();
            isRolling = false;
            document.getElementById('roll-btn').disabled = false;
        }

        function animateDice(roll) {
            const dice = document.getElementById('dice');
            const rotations = {
                1: 'rotateY(0deg)',
                2: 'rotateY(180deg)',
                3: 'rotateY(-90deg)',
                4: 'rotateY(90deg)',
                5: 'rotateX(-90deg)',
                6: 'rotateX(90deg)'
            };
            // Add extra spins
            dice.style.transform = `rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`;
            
            return new Promise(resolve => {
                setTimeout(() => {
                    dice.style.transform = rotations[roll];
                    resolve();
                }, 1000);
            });
        }

        function updatePlayerPos(pIdx) {
            const p = players[pIdx];
            const cell = document.getElementById('cell-' + p.pos);
            const rect = cell.getBoundingClientRect();
            const boardRect = board.getBoundingClientRect();
            
            const el = document.getElementById(p.id);
            const offset = pIdx * 5; // Offset players slightly
            el.style.left = (rect.left - boardRect.left + 15 + offset) + 'px';
            el.style.top = (rect.top - boardRect.top + 15 + offset) + 'px';
            
            document.getElementById(`${p.id}-pos`).innerText = `Position: ${p.pos}`;
        }

        function updateUI() {
            document.getElementById('p1-panel').classList.toggle('active-turn', turn === 0);
            document.getElementById('p2-panel').classList.toggle('active-turn', turn === 1);
        }

        window.onload = createBoard;
        window.onresize = () => location.reload(); // Refresh to recalculate connector positions
    </script>
</body>
</html>
