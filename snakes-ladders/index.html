<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snakes & Ladders | Bishop Coins | Dual Victory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        /* White advertisement zones */
        .ad-top, .ad-bottom {
            width: 100%;
            max-width: 570px;
            margin: 4px auto;
            background: white;
            border-radius: 12px;
            height: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .game-container {
            background: linear-gradient(145deg, rgba(25, 20, 15, 0.95), rgba(15, 10, 8, 0.98));
            border-radius: 32px;
            padding: 14px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,215,0,0.15);
            border: 1px solid rgba(255,215,0,0.25);
            max-width: 570px;
            width: 100%;
            position: relative;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            margin-bottom: 6px;
            background: linear-gradient(135deg, #f3b33d, #ffd966, #c2811a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .snake-icon {
            font-size: 1.5rem;
            display: inline-block;
        }

        .player-panel {
            background: linear-gradient(145deg, #2a1f12, #1e150a);
            border-radius: 40px;
            padding: 6px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .players-area {
            display: flex;
            gap: 10px;
            background: #1a1208;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .player-card {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 28px;
            transition: all 0.3s ease;
            text-align: center;
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            min-width: 85px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .player-card.active {
            transform: scale(1.02);
            box-shadow: 0 0 0 2px #ffd700, 0 0 10px rgba(255,215,0,0.5);
        }
        .player-card .player-name { font-size: 0.65rem; letter-spacing: 0.5px; }
        .player-card .piece-positions { font-size: 0.6rem; margin-top: 3px; background: rgba(0,0,0,0.4); border-radius: 16px; padding: 2px; }
        .player-red-bg { background: linear-gradient(135deg, #dc2626, #991b1b); color: white; }
        .player-navy-bg { background: linear-gradient(135deg, #1e3a5f, #0f2a44); color: white; }

        .turn-indicator {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            padding: 5px 16px;
            border-radius: 28px;
            font-weight: bold;
            font-size: 0.75rem;
            color: #2c1a0a;
        }

        .dice-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #2a1f12;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .dice-container {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            border: 2px solid #ffd700;
            cursor: pointer;
        }
        .static-dice {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(145deg, #fff, #f5f5f5);
            border-radius: 14px;
            color: #c41e1e;
        }
        .dice-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-15deg) rotateY(15deg);
        }
        .dice-3d.rolling {
            animation: dice3DRoll 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        @keyframes dice3DRoll {
            0% { transform: rotateX(-15deg) rotateY(15deg) scale(1); }
            25% { transform: rotateX(180deg) rotateY(90deg) scale(1.1); }
            50% { transform: rotateX(360deg) rotateY(180deg) scale(1); }
            75% { transform: rotateX(540deg) rotateY(270deg) scale(1.05); }
            100% { transform: rotateX(720deg) rotateY(360deg) scale(1); }
        }
        .dice-face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            border: 1.5px solid #ffd700;
            backface-visibility: visible;
        }
        .dice-face-1 { transform: translateZ(30px); }
        .dice-face-2 { transform: rotateY(180deg) translateZ(30px); }
        .dice-face-3 { transform: rotateY(90deg) translateZ(30px); }
        .dice-face-4 { transform: rotateY(-90deg) translateZ(30px); }
        .dice-face-5 { transform: rotateX(90deg) translateZ(30px); }
        .dice-face-6 { transform: rotateX(-90deg) translateZ(30px); }

        button {
            background: linear-gradient(135deg, #ffb347, #ff9800);
            border: none;
            padding: 6px 18px;
            border-radius: 36px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #a45d2e;
            color: #2c1a0a;
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a45d2e; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .board-wrapper {
            position: relative;
            margin: 12px 0 65px 0;
            border-radius: 20px;
            background: linear-gradient(145deg, #f7e1aa, #e6cfa0);
            padding: 6px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.5), inset 0 0 0 2px #ffd700, inset 0 0 0 4px #ba7f3a;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            background: #f7e1aa;
            border-radius: 14px;
            overflow: visible;
            position: relative;
            aspect-ratio: 1 / 1;
        }
        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(7px, 2.2vw, 10px);
            background: linear-gradient(145deg, #fff8e7, #f5e6c8);
            position: relative;
            border: 0.5px solid #deb887;
            color: #5a3a1a;
            z-index: 2;
        }
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Bishop Token on board - dynamic offset via style */
        .bishop-token {
            position: absolute;
            width: 22px;
            height: 30px;
            transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            z-index: 20;
            cursor: pointer;
            top: 50%;
            left: 50%;
        }
        .bishop-token.selectable {
            filter: drop-shadow(0 0 0 3px gold) drop-shadow(0 0 8px orange);
        }
        .bishop-body {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 5px 5px 8px 8px;
        }
        .bishop-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 6px;
            border-radius: 3px 3px 5px 5px;
            background: linear-gradient(145deg, #ddd, #aaa);
        }
        .bishop-mid {
            position: absolute;
            bottom: 4px;
            left: 3px;
            right: 3px;
            height: 13px;
            border-radius: 3px;
        }
        .bishop-hat {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 10px solid;
            border-radius: 2px;
        }
        .bishop-slit {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 5px;
            background: #333;
            border-radius: 1px;
            opacity: 0.5;
        }
        .bishop-top {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffd700;
        }

        /* Permanent Stacks */
        .stacks-container {
            position: absolute;
            bottom: -55px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 30;
            pointer-events: none;
        }
        .piece-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,215,0,0.7);
            pointer-events: auto;
            min-width: 80px;
        }
        .stack-label {
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffd966;
        }
        .stack-pieces {
            display: flex;
            gap: 8px;
            justify-content: center;
            min-height: 42px;
            align-items: center;
        }
        .stack-bishop {
            width: 28px;
            height: 38px;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .stack-bishop.selectable-stack {
            filter: drop-shadow(0 0 0 3px gold);
            transform: scale(1.05);
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            margin: 8px 5px 0 0;
        }
        #resetGameBtn {
            background: linear-gradient(135deg, #ffb347, #ff9800);
            padding: 5px 18px;
            font-size: 0.75rem;
            margin-right: 5px;
        }
        .message-area {
            background: #1a1208;
            color: #ffeaaf;
            text-align: center;
            padding: 6px;
            border-radius: 24px;
            font-weight: 500;
            margin-top: 8px;
            font-size: 0.7rem;
        }

        @media (max-width: 600px) {
            .game-container { max-width: 95%; padding: 10px; }
            .stacks-container { bottom: -50px; }
            .piece-stack { padding: 3px 8px; min-width: 65px; }
            .stack-bishop { width: 24px; height: 32px; }
            .bishop-token { width: 18px; height: 26px; }
            .dice-container, .dice-face { width: 50px; height: 50px; }
            .dice-face { font-size: 2.5rem; }
            .dice-face-1 { transform: translateZ(25px); }
            .dice-face-2 { transform: rotateY(180deg) translateZ(25px); }
            .dice-face-3 { transform: rotateY(90deg) translateZ(25px); }
            .dice-face-4 { transform: rotateY(-90deg) translateZ(25px); }
            .dice-face-5 { transform: rotateX(90deg) translateZ(25px); }
            .dice-face-6 { transform: rotateX(-90deg) translateZ(25px); }
            .static-dice { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div class="ad-top"></div>

<div class="game-container">
    <h1>
        <span class="snake-icon">🐍</span> SNAKES & LADDERS <span class="snake-icon">🪜</span>
    </h1>
    
    <div class="player-panel">
        <div class="players-area" id="playersArea">
            <div class="player-card player-red-bg active" id="player0Card">
                <div class="player-name">🔴 PLAYER 1</div>
                <div class="piece-positions" id="piecePos0">♟️ waiting</div>
            </div>
            <div class="player-card player-navy-bg" id="player1Card">
                <div class="player-name">⚓ PLAYER 2</div>
                <div class="piece-positions" id="piecePos1">♟️ waiting</div>
            </div>
        </div>
        <div class="turn-indicator" id="turnIndicator">🎲 PLAYER 1's TURN</div>
        <div class="dice-area">
            <div class="dice-container" id="diceContainer"></div>
            <button id="rollBtn">ROLL</button>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="board" id="gameBoard"></div>
        <svg class="svg-overlay" id="svgOverlay"></svg>
        <div class="stacks-container" id="stacksContainer"></div>
    </div>

    <div class="action-buttons">
        <button id="resetGameBtn">🔄 NEW GAME</button>
    </div>
    <div class="message-area" id="statusMsg">✨ Roll dice → Click on YOUR piece to move. Both pieces must reach 100 to win! ✨</div>
</div>

<div class="ad-bottom"></div>

<script>
    (function(){
        const SNAKES = { 99: 5, 94: 66, 70: 51, 57: 25, 45: 13 };
        const LADDERS = { 21: 98, 15: 96, 3: 77, 7: 53, 54: 88 };
        
        let players = [
            { id: 0, name: "PLAYER 1", color: "red", pieces: [{ id: 0, pos: 0 }, { id: 1, pos: 0 }] },
            { id: 1, name: "PLAYER 2", color: "navy", pieces: [{ id: 0, pos: 0 }, { id: 1, pos: 0 }] }
        ];
        
        let currentPlayerIdx = 0;
        let gameActive = true;
        let winnerId = null;
        let rolling = false;
        let awaitingPieceSelection = false;
        let currentRollValue = null;
        let processingMove = false;
        
        const boardDiv = document.getElementById("gameBoard");
        const svgOverlay = document.getElementById("svgOverlay");
        const diceContainer = document.getElementById("diceContainer");
        const rollBtn = document.getElementById("rollBtn");
        const resetBtn = document.getElementById("resetGameBtn");
        const turnSpan = document.getElementById("turnIndicator");
        const msgDiv = document.getElementById("statusMsg");
        const stacksContainer = document.getElementById("stacksContainer");
        
        function getCellCenter(cellNumber) {
            const cell = document.getElementById(`cell-${cellNumber}`);
            if (!cell) return null;
            const rect = cell.getBoundingClientRect();
            const boardRect = boardDiv.getBoundingClientRect();
            return {
                x: rect.left + rect.width/2 - boardRect.left,
                y: rect.top + rect.height/2 - boardRect.top
            };
        }
        
        // Snake/ladder resolve (one step)
        function resolveSnakeOrLadder(pos) {
            if (SNAKES[pos]) return SNAKES[pos];
            if (LADDERS[pos]) return LADDERS[pos];
            return pos;
        }
        
        // Count opponent pieces on a given cell (excluding 100)
        function countOpponentPiecesOnCell(cell, opponentPlayerId) {
            if (cell === 100) return 0;
            const opponent = players[opponentPlayerId];
            return opponent.pieces.filter(p => p.pos === cell).length;
        }
        
        // Knockout: if exactly one opponent piece on cell, send it to stack (pos=0), return true
        function knockoutSingleOpponentPiece(cell, opponentPlayerId) {
            if (cell === 100) return false;
            const opponent = players[opponentPlayerId];
            const piecesOnCell = opponent.pieces.filter(p => p.pos === cell);
            if (piecesOnCell.length === 1) {
                const piece = piecesOnCell[0];
                piece.pos = 0;
                return true;
            }
            return false;
        }
        
        // Realistic snake drawing (kept original)
        function drawRealisticSnake(startX, startY, endX, endY) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const dx = endX - startX;
            const dy = endY - startY;
            const distance = Math.hypot(dx, dy);
            let pathData = `M ${startX} ${startY}`;
            const segments = Math.max(6, Math.floor(distance / 20));
            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const x = startX + dx * t;
                const y = startY + dy * t;
                const offset = Math.sin(t * Math.PI * 3.5) * 10;
                const perpX = -dy / distance * offset;
                const perpY = dx / distance * offset;
                const cx = x + perpX;
                const cy = y + perpY;
                const prevT = (i - 1) / segments;
                const prevX = startX + dx * prevT;
                const prevY = startY + dy * prevT;
                const prevOffset = Math.sin(prevT * Math.PI * 3.5) * 10;
                const prevPerpX = -dy / distance * prevOffset;
                const prevPerpY = dx / distance * prevOffset;
                const px = prevX + prevPerpX;
                const py = prevY + prevPerpY;
                pathData += ` Q ${px + (cx - px) * 0.5} ${py + (cy - py) * 0.5}, ${cx} ${cy}`;
            }
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("stroke", "url(#snakeBodyGrad)");
            path.setAttribute("stroke-width", "14");
            path.setAttribute("fill", "none");
            path.setAttribute("stroke-linecap", "round");
            group.appendChild(path);
            for (let i = 1; i <= 12; i++) {
                const t = i / 13;
                const x = startX + dx * t;
                const y = startY + dy * t;
                const offset = Math.sin(t * Math.PI * 3.5) * 10;
                const perpX = -dy / distance * offset;
                const perpY = dx / distance * offset;
                const scaleX = x + perpX;
                const scaleY = y + perpY;
                const scale = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
                scale.setAttribute("cx", scaleX);
                scale.setAttribute("cy", scaleY);
                scale.setAttribute("rx", "4");
                scale.setAttribute("ry", "2.5");
                scale.setAttribute("fill", "#e67e22");
                scale.setAttribute("opacity", "0.9");
                group.appendChild(scale);
            }
            const headGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const headShape = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
            headShape.setAttribute("cx", startX);
            headShape.setAttribute("cy", startY);
            headShape.setAttribute("rx", "14");
            headShape.setAttribute("ry", "10");
            headShape.setAttribute("fill", "#2d6a2f");
            headShape.setAttribute("stroke", "#f1c40f");
            headShape.setAttribute("stroke-width", "1.5");
            headGroup.appendChild(headShape);
            const eyeL = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            eyeL.setAttribute("cx", startX - 6);
            eyeL.setAttribute("cy", startY - 3);
            eyeL.setAttribute("r", "3");
            eyeL.setAttribute("fill", "#ffff00");
            headGroup.appendChild(eyeL);
            const eyeLPupil = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            eyeLPupil.setAttribute("cx", startX - 6);
            eyeLPupil.setAttribute("cy", startY - 3);
            eyeLPupil.setAttribute("r", "1.5");
            eyeLPupil.setAttribute("fill", "#000");
            headGroup.appendChild(eyeLPupil);
            const eyeR = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            eyeR.setAttribute("cx", startX + 6);
            eyeR.setAttribute("cy", startY - 3);
            eyeR.setAttribute("r", "3");
            eyeR.setAttribute("fill", "#ffff00");
            headGroup.appendChild(eyeR);
            const eyeRPupil = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            eyeRPupil.setAttribute("cx", startX + 6);
            eyeRPupil.setAttribute("cy", startY - 3);
            eyeRPupil.setAttribute("r", "1.5");
            eyeRPupil.setAttribute("fill", "#000");
            headGroup.appendChild(eyeRPupil);
            const tongue = document.createElementNS("http://www.w3.org/2000/svg", "path");
            tongue.setAttribute("d", `M ${startX} ${startY+5} L ${startX-6} ${startY+12} M ${startX} ${startY+5} L ${startX+6} ${startY+12}`);
            tongue.setAttribute("stroke", "#ff4444");
            tongue.setAttribute("stroke-width", "2");
            tongue.setAttribute("fill", "none");
            headGroup.appendChild(tongue);
            group.appendChild(headGroup);
            const tail = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            tail.setAttribute("cx", endX);
            tail.setAttribute("cy", endY);
            tail.setAttribute("r", "6");
            tail.setAttribute("fill", "#b87333");
            tail.setAttribute("stroke", "#f1c40f");
            group.appendChild(tail);
            return group;
        }
        
        function drawLadder(startX, startY, endX, endY) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const leftRail = document.createElementNS("http://www.w3.org/2000/svg", "line");
            leftRail.setAttribute("x1", startX - 8);
            leftRail.setAttribute("y1", startY);
            leftRail.setAttribute("x2", endX - 8);
            leftRail.setAttribute("y2", endY);
            leftRail.setAttribute("stroke", "#8B5A2B");
            leftRail.setAttribute("stroke-width", "4.5");
            group.appendChild(leftRail);
            const rightRail = document.createElementNS("http://www.w3.org/2000/svg", "line");
            rightRail.setAttribute("x1", startX + 8);
            rightRail.setAttribute("y1", startY);
            rightRail.setAttribute("x2", endX + 8);
            rightRail.setAttribute("y2", endY);
            rightRail.setAttribute("stroke", "#8B5A2B");
            rightRail.setAttribute("stroke-width", "4.5");
            group.appendChild(rightRail);
            const steps = Math.floor(Math.hypot(endX - startX, endY - startY) / 24);
            for (let i = 1; i <= steps; i++) {
                const t = i / (steps + 1);
                const x = startX + (endX - startX) * t;
                const y = startY + (endY - startY) * t;
                const rung = document.createElementNS("http://www.w3.org/2000/svg", "line");
                rung.setAttribute("x1", x - 8);
                rung.setAttribute("y1", y);
                rung.setAttribute("x2", x + 8);
                rung.setAttribute("y2", y);
                rung.setAttribute("stroke", "#DAA520");
                rung.setAttribute("stroke-width", "3.5");
                group.appendChild(rung);
            }
            return group;
        }
        
        function drawConnections() {
            svgOverlay.innerHTML = '';
            const boardRect = boardDiv.getBoundingClientRect();
            if (boardRect.width === 0) return;
            svgOverlay.setAttribute('viewBox', `0 0 ${boardRect.width} ${boardRect.height}`);
            svgOverlay.style.width = `${boardRect.width}px`;
            svgOverlay.style.height = `${boardRect.height}px`;
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            const snakeGrad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
            snakeGrad.setAttribute("id", "snakeBodyGrad");
            const stop1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop1.setAttribute("offset", "0%");
            stop1.setAttribute("stop-color", "#27ae60");
            const stop2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop2.setAttribute("offset", "100%");
            stop2.setAttribute("stop-color", "#1e5631");
            snakeGrad.appendChild(stop1);
            snakeGrad.appendChild(stop2);
            defs.appendChild(snakeGrad);
            svgOverlay.appendChild(defs);
            for (const [head, tail] of Object.entries(SNAKES)) {
                const start = getCellCenter(parseInt(head));
                const end = getCellCenter(tail);
                if (start && end) svgOverlay.appendChild(drawRealisticSnake(start.x, start.y, end.x, end.y));
            }
            for (const [bottom, top] of Object.entries(LADDERS)) {
                const start = getCellCenter(parseInt(bottom));
                const end = getCellCenter(top);
                if (start && end) svgOverlay.appendChild(drawLadder(start.x, start.y, end.x, end.y));
            }
        }
        
        function buildBoard() {
            boardDiv.innerHTML = "";
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 10; col++) {
                    let cellNumber;
                    if (row === 0) cellNumber = 100 - col;
                    else if (row === 1) cellNumber = 81 + col;
                    else if (row === 2) cellNumber = 80 - col;
                    else if (row === 3) cellNumber = 61 + col;
                    else if (row === 4) cellNumber = 60 - col;
                    else if (row === 5) cellNumber = 41 + col;
                    else if (row === 6) cellNumber = 40 - col;
                    else if (row === 7) cellNumber = 21 + col;
                    else if (row === 8) cellNumber = 20 - col;
                    else cellNumber = 1 + col;
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.id = `cell-${cellNumber}`;
                    const span = document.createElement("span");
                    span.innerText = cellNumber;
                    cell.appendChild(span);
                    boardDiv.appendChild(cell);
                }
            }
        }
        
        function createBoardTokenElement(color, pieceIdx) {
            const tokenDiv = document.createElement("div");
            tokenDiv.className = "bishop-token";
            const body = document.createElement("div");
            body.className = "bishop-body";
            const base = document.createElement("div");
            base.className = "bishop-base";
            base.style.background = color === 'red' ? 'linear-gradient(145deg, #ff6666, #cc0000)' : 'linear-gradient(145deg, #4a7a9e, #0f2a44)';
            const mid = document.createElement("div");
            mid.className = "bishop-mid";
            mid.style.background = color === 'red' ? 'linear-gradient(145deg, #ff4444, #b32d2d)' : 'linear-gradient(145deg, #3a6a8e, #1a3a54)';
            const hat = document.createElement("div");
            hat.className = "bishop-hat";
            hat.style.borderBottomColor = color === 'red' ? '#cc0000' : '#0f2a44';
            const slit = document.createElement("div");
            slit.className = "bishop-slit";
            const top = document.createElement("div");
            top.className = "bishop-top";
            body.appendChild(base);
            body.appendChild(mid);
            body.appendChild(hat);
            body.appendChild(slit);
            body.appendChild(top);
            tokenDiv.appendChild(body);
            return tokenDiv;
        }
        
        let currentDiceValue = 1;
        function showStaticDice(value) {
            diceContainer.innerHTML = '';
            const staticDiv = document.createElement('div');
            staticDiv.className = 'static-dice';
            const symbols = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
            staticDiv.innerText = symbols[value-1];
            diceContainer.appendChild(staticDiv);
        }
        
        function show3dDice() {
            diceContainer.innerHTML = '';
            const dice3dDiv = document.createElement('div');
            dice3dDiv.className = 'dice-3d';
            dice3dDiv.id = 'dice3d';
            const symbols = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
            for (let i = 1; i <= 6; i++) {
                const face = document.createElement('div');
                face.className = `dice-face dice-face-${i}`;
                face.innerText = symbols[i-1];
                dice3dDiv.appendChild(face);
            }
            diceContainer.appendChild(dice3dDiv);
        }
        
        function checkWinner(playerId) {
            const player = players[playerId];
            const bothAt100 = player.pieces.every(piece => piece.pos === 100);
            if (bothAt100) {
                gameActive = false;
                winnerId = playerId;
                msgDiv.innerHTML = `🏆✨ ${player.name} WINS by getting BOTH pieces to 100! ✨🏆`;
                turnSpan.innerHTML = `🏆 WINNER: ${player.name} 🏆`;
                rollBtn.disabled = true;
                return true;
            }
            return false;
        }
        
        // Renders side-by-side pieces on board + stacks
        function renderStacksAndTokens() {
            stacksContainer.innerHTML = '';
            document.querySelectorAll('.bishop-token').forEach(t => t.remove());
            // Stacks rendering
            for (let p of players) {
                const stackDiv = document.createElement('div');
                stackDiv.className = 'piece-stack';
                stackDiv.dataset.playerId = p.id;
                const label = document.createElement('div');
                label.className = 'stack-label';
                label.innerText = p.color === 'red' ? '🔴 RED' : '🔵 NAVY';
                const piecesContainer = document.createElement('div');
                piecesContainer.className = 'stack-pieces';
                const offBoardPieces = p.pieces.filter(piece => piece.pos === 0);
                for (let idx = 0; idx < offBoardPieces.length; idx++) {
                    const pieceWrapper = document.createElement('div');
                    pieceWrapper.className = 'stack-bishop';
                    pieceWrapper.dataset.playerId = p.id;
                    pieceWrapper.dataset.pieceIdx = offBoardPieces[idx].id;
                    const miniToken = createBoardTokenElement(p.color, idx);
                    miniToken.style.position = 'relative';
                    miniToken.style.transform = 'none';
                    miniToken.style.width = '28px';
                    miniToken.style.height = '38px';
                    pieceWrapper.appendChild(miniToken);
                    piecesContainer.appendChild(pieceWrapper);
                }
                if (offBoardPieces.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.style.width = '28px';
                    emptyDiv.style.height = '38px';
                    emptyDiv.style.opacity = '0.3';
                    piecesContainer.appendChild(emptyDiv);
                }
                stackDiv.appendChild(label);
                stackDiv.appendChild(piecesContainer);
                stacksContainer.appendChild(stackDiv);
            }
            
            // Build per-cell token map for side-by-side display
            const cellMap = new Map(); // cell -> array of {playerId, pieceIdx, color}
            for (let p of players) {
                p.pieces.forEach((piece, idx) => {
                    if (piece.pos >= 1 && piece.pos <= 100) {
                        if (!cellMap.has(piece.pos)) cellMap.set(piece.pos, []);
                        cellMap.get(piece.pos).push({ playerId: p.id, pieceIdx: piece.id, color: p.color });
                    }
                });
            }
            for (let [cellNum, piecesOnCell] of cellMap.entries()) {
                const cellDiv = document.getElementById(`cell-${cellNum}`);
                if (!cellDiv) continue;
                const count = piecesOnCell.length;
                piecesOnCell.forEach((info, index) => {
                    const token = createBoardTokenElement(info.color, info.pieceIdx);
                    token.dataset.playerId = info.playerId;
                    token.dataset.pieceIdx = info.pieceIdx;
                    // Dynamic side-by-side offset: avoid overlapping
                    const offsetX = (index - (count-1)/2) * 14;
                    token.style.transform = `translate(calc(-50% + ${offsetX}px), -50%)`;
                    cellDiv.appendChild(token);
                });
            }
            
            // Add selection highlights if needed
            if (awaitingPieceSelection && gameActive && !winnerId) {
                const curr = players[currentPlayerIdx];
                document.querySelectorAll('.bishop-token').forEach(tok => {
                    if (parseInt(tok.dataset.playerId) === curr.id) tok.classList.add('selectable');
                });
                document.querySelectorAll('.stack-bishop').forEach(sb => {
                    if (parseInt(sb.dataset.playerId) === curr.id) sb.classList.add('selectable-stack');
                });
            }
        }
        
        function updateUI() {
            players.forEach(p => {
                const posDiv = document.getElementById(`piecePos${p.id}`);
                if (posDiv) {
                    const positions = p.pieces.map(pi => pi.pos === 0 ? '📦' : (pi.pos === 100 ? '🏆' : pi.pos)).join(' & ');
                    posDiv.innerHTML = `♟️ ${positions}`;
                }
            });
            document.querySelectorAll('.player-card').forEach((card, idx) => {
                if (idx === currentPlayerIdx && gameActive && !winnerId) card.classList.add('active');
                else card.classList.remove('active');
            });
            if (winnerId !== null) {
                rollBtn.disabled = true;
            } else {
                rollBtn.disabled = (rolling || awaitingPieceSelection || processingMove);
                turnSpan.innerHTML = `🎲 ${players[currentPlayerIdx].name}'s TURN`;
            }
        }
        
        async function movePiece(playerId, pieceIdx, steps) {
            const player = players[playerId];
            const piece = player.pieces[pieceIdx];
            if (piece.pos === 100) return { won: false, extraTurn: false, invalid: true };
            
            let newPos = (piece.pos === 0) ? steps : piece.pos + steps;
            if (newPos > 100) return { won: false, extraTurn: false, invalid: true };
            
            // resolve snake/ladder to get final landing position
            let finalPos = resolveSnakeOrLadder(newPos);
            let ladderMsg = (finalPos !== newPos && LADDERS[newPos]) ? true : false;
            let snakeMsg = (finalPos !== newPos && SNAKES[newPos]) ? true : false;
            
            // Knockout rule: before moving, check opponent pieces on finalPos (exactly one => knockout)
            const opponentId = playerId === 0 ? 1 : 0;
            let knockedOut = false;
            if (finalPos !== 100) {
                const cnt = countOpponentPiecesOnCell(finalPos, opponentId);
                if (cnt === 1) {
                    knockedOut = knockoutSingleOpponentPiece(finalPos, opponentId);
                    if (knockedOut) {
                        msgDiv.innerHTML = `⚔️ KNOCKOUT! ${players[playerId].name} landed on a single opponent piece at ${finalPos}. Opponent piece returns to stack! + extra turn`;
                        renderStacksAndTokens();
                        await delay(500);
                    }
                }
            }
            
            // Apply movement
            const oldPos = piece.pos;
            piece.pos = finalPos;
            renderStacksAndTokens();
            updateUI();
            await delay(380);
            
            // Show snake/ladder message
            if (ladderMsg) msgDiv.innerHTML = `🪜 LADDER! ${player.name} climbed from ${newPos} to ${finalPos}!`;
            else if (snakeMsg) msgDiv.innerHTML = `🐍 SNAKE! ${player.name} slid from ${newPos} to ${finalPos}!`;
            else if (oldPos === 0) msgDiv.innerHTML = `🚀 ${player.name} piece enters at ${finalPos}!`;
            else msgDiv.innerHTML = `🎲 ${player.name} moved piece to ${finalPos}.`;
            
            renderStacksAndTokens();
            updateUI();
            await delay(400);
            
            const winnerDeclared = checkWinner(playerId);
            if (winnerDeclared) return { won: true, extraTurn: false, invalid: false };
            
            let extraTurn = (knockedOut) || (steps === 6);
            return { won: false, extraTurn: extraTurn, invalid: false };
        }
        
        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        
        async function onPieceSelected(e) {
            let target = e.target.closest('.bishop-token') || e.target.closest('.stack-bishop');
            if (!target) return;
            if (!awaitingPieceSelection || processingMove || !gameActive || winnerId !== null) return;
            
            let playerId = parseInt(target.dataset.playerId);
            let pieceIdx = parseInt(target.dataset.pieceIdx);
            if (playerId !== currentPlayerIdx) return;
            
            const piece = players[currentPlayerIdx].pieces[pieceIdx];
            if (piece.pos === 100) return;
            if (piece.pos !== 0 && piece.pos + currentRollValue > 100) return;
            
            awaitingPieceSelection = false;
            processingMove = true;
            rollBtn.disabled = true;
            const { won, extraTurn, invalid } = await movePiece(currentPlayerIdx, pieceIdx, currentRollValue);
            renderStacksAndTokens();
            updateUI();
            if (won) { processingMove = false; return; }
            if (invalid) {
                processingMove = false;
                awaitingPieceSelection = true;
                rolling = false;
                rollBtn.disabled = false;
                renderStacksAndTokens();
                updateUI();
                return;
            }
            await delay(400);
            if (extraTurn) {
                msgDiv.innerHTML = `🎲 EXTRA TURN for ${players[currentPlayerIdx].name}! Roll again.`;
                processingMove = false;
                rolling = false;
                rollBtn.disabled = false;
                updateUI();
                return;
            }
            currentPlayerIdx = currentPlayerIdx === 0 ? 1 : 0;
            processingMove = false;
            rolling = false;
            updateUI();
            msgDiv.innerHTML = `${players[currentPlayerIdx].name}'s turn. Click ROLL!`;
            rollBtn.disabled = false;
        }
        
        async function performRoll() {
            if (!gameActive || rolling || awaitingPieceSelection || processingMove || winnerId !== null) return;
            rolling = true;
            rollBtn.disabled = true;
            show3dDice();
            const dice3dElem = document.getElementById('dice3d');
            dice3dElem.classList.add('rolling');
            let rollInterval = setInterval(() => {
                const rand = Math.floor(Math.random() * 6) + 1;
                const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
                const faceEls = document.querySelectorAll('.dice-face');
                for (let i = 0; i < faceEls.length; i++) faceEls[i].innerText = faces[rand - 1];
            }, 70);
            await delay(550);
            clearInterval(rollInterval);
            const finalValue = Math.floor(Math.random() * 6) + 1;
            const finalFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
            const faceEls = document.querySelectorAll('.dice-face');
            for (let i = 0; i < faceEls.length; i++) faceEls[i].innerText = finalFaces[finalValue - 1];
            dice3dElem.classList.remove('rolling');
            showStaticDice(finalValue);
            currentRollValue = finalValue;
            msgDiv.innerHTML = `🎲 ${players[currentPlayerIdx].name} rolled ${finalValue}! Click on YOUR piece to move.`;
            
            const player = players[currentPlayerIdx];
            const canMoveAny = player.pieces.some(p => {
                if (p.pos === 100) return false;
                if (p.pos === 0) return true;
                return p.pos + finalValue <= 100;
            });
            if (!canMoveAny) {
                msgDiv.innerHTML = `😵 No movable piece. Turn ends.`;
                rolling = false;
                if (finalValue !== 6) currentPlayerIdx = currentPlayerIdx === 0 ? 1 : 0;
                updateUI();
                rollBtn.disabled = false;
                return;
            }
            awaitingPieceSelection = true;
            rolling = false;
            renderStacksAndTokens();
            updateUI();
        }
        
        function resetGame() {
            rolling = false;
            awaitingPieceSelection = false;
            processingMove = false;
            currentRollValue = null;
            players.forEach(p => {
                p.pieces[0].pos = 0;
                p.pieces[1].pos = 0;
            });
            currentPlayerIdx = 0;
            gameActive = true;
            winnerId = null;
            rollBtn.disabled = false;
            showStaticDice(1);
            updateUI();
            renderStacksAndTokens();
            msgDiv.innerHTML = "✨ Game reset! Both pieces must reach 100 to win. Roll and click your piece! ✨";
            setTimeout(() => { drawConnections(); renderStacksAndTokens(); }, 80);
        }
        
        rollBtn.addEventListener("click", performRoll);
        resetBtn.addEventListener("click", resetGame);
        document.querySelector('.game-container').addEventListener('click', onPieceSelected);
        
        buildBoard();
        resetGame();
        window.addEventListener('resize', () => {
            setTimeout(() => { drawConnections(); renderStacksAndTokens(); }, 120);
        });
        setTimeout(() => drawConnections(), 100);
    })();
</script>
</body>
</html>
