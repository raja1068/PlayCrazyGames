<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --bg-dark: #0f1218;
            --card-bg: #1a1f26;
            --player1: #ffd700;
            --player2: #c0c0c0;
            --cell-size: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1e2530 0%, #0f1218 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- UI Header & Scoreboard --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .player-card {
            flex: 1;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            transition: all 0.3s ease;
        }

        .player-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
            transform: scale(1.05);
        }

        /* --- Game Board --- */
        .board-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            background: #222;
            border: 8px solid var(--gold);
            border-image: linear-gradient(to bottom right, #b8860b, #ffd700, #b8860b) 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 10%);
            grid-template-rows: repeat(10, 10%);
            width: 100%;
            height: 100%;
            position: relative;
        }

        .cell {
            border: 0.1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            position: relative;
        }

        /* Zigzag Coloring mimicking the requested board style */
        .cell:nth-child(odd) { background: rgba(255,255,255,0.02); }

        /* --- Players --- */
        .p-coin {
            width: 6%;
            height: 6%;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .p1-coin { background: radial-gradient(circle at 30% 30%, #fff, var(--player1)); left: 2%; bottom: 2%; }
        .p2-coin { background: radial-gradient(circle at 30% 30%, #fff, var(--player2)); left: 2%; bottom: 2%; }

        /* --- Overlay Elements (Snakes/Ladders) --- */
        .connector {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            transform-origin: top center;
        }

        /* Snake Styling */
        .snake {
            background: linear-gradient(90deg, #2d5a4c 0%, #4ea58a 50%, #2d5a4c 100%);
            border-radius: 50px;
            opacity: 0.85;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Ladder Styling */
        .ladder {
            width: 20px;
            background: repeating-linear-gradient(0deg, #3d2b1f 0px, #3d2b1f 5px, transparent 5px, transparent 20px),
                        linear-gradient(90deg, #5c4033 0%, #2b1d16 20%, #2b1d16 80%, #5c4033 100%);
            border-left: 3px solid #3d2b1f;
            border-right: 3px solid #3d2b1f;
        }

        /* --- 3D Dice --- */
        .controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dice-container {
            perspective: 600px;
            width: 60px;
            height: 60px;
        }

        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s;
        }

        .dice-face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 5px;
        }

        .dot { background: #333; border-radius: 50%; width: 10px; height: 10px; align-self: center; justify-self: center; }

        /* Dice Face Rotations */
        .f1 { transform: translateZ(30px); }
        .f2 { transform: rotateY(180deg) translateZ(30px); }
        .f3 { transform: rotateY(90deg) translateZ(30px); }
        .f4 { transform: rotateY(-90deg) translateZ(30px); }
        .f5 { transform: rotateX(90deg) translateZ(30px); }
        .f6 { transform: rotateX(-90deg) translateZ(30px); }

        .btn-roll {
            background: linear-gradient(to bottom, var(--gold), #b8860b);
            border: none;
            color: white;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-roll:active { transform: translateY(2px); }
        .btn-roll:disabled { opacity: 0.5; cursor: not-allowed; }

        #msg { height: 20px; font-weight: 700; color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <h1>SNAKES & LADDERS</h1>
        <p>PREMIUM EDITION</p>
    </div>

    <div class="scoreboard">
        <div class="player-card active" id="card-0">
            <div style="color:var(--player1)">PLAYER 1</div>
            <div id="pos-0">Position: 1</div>
        </div>
        <div class="player-card" id="card-1">
            <div style="color:var(--player2)">PLAYER 2</div>
            <div id="pos-1">Position: 1</div>
        </div>
    </div>

    <div class="board-container">
        <div id="board"></div>
        <div id="p0-coin" class="p-coin p1-coin"></div>
        <div id="p1-coin" class="p-coin p2-coin"></div>
        </div>

    <div class="controls">
        <div id="msg">Your Turn, Player 1</div>
        <div class="dice-container">
            <div class="dice" id="dice">
                <div class="dice-face f1"><div class="dot" style="grid-area: 2/2"></div></div>
                <div class="dice-face f2"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
                <div class="dice-face f3"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/3"></div></div>
                <div class="dice-face f4"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
                <div class="dice-face f5"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
                <div class="dice-face f6"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/1"></div><div class="dot" style="grid-area: 2/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
            </div>
        </div>
        <button class="btn-roll" id="roll-btn">Roll Dice</button>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const rollBtn = document.getElementById('roll-btn');
        const diceEl = document.getElementById('dice');
        const msgEl = document.getElementById('msg');

        let currentPlayer = 0;
        let playerPos = [1, 1];
        let isRolling = false;

        const MAP = {
            ladders: { 3: 77, 15: 96, 21: 98, 7: 53, 54: 88 },
            snakes: { 99: 5, 94: 66, 57: 25, 45: 13, 70: 51 }
        };

        // --- 1. Board Generation ---
        function createBoard() {
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 10; col++) {
                    let num;
                    if (row % 2 === 0) {
                        num = (row * 10) + (10 - col);
                    } else {
                        num = (row * 10) + (col + 1);
                    }
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${num}`;
                    cell.innerText = num;
                    boardEl.appendChild(cell);
                }
            }
            // Draw visual connectors
            Object.entries(MAP.ladders).forEach(([s, e]) => drawConnector(s, e, 'ladder'));
            Object.entries(MAP.snakes).forEach(([s, e]) => drawConnector(s, e, 'snake'));
        }

        // --- 2. Coordinate System ---
        function getCoords(num) {
            const row = Math.floor((num - 1) / 10);
            let col = (num - 1) % 10;
            if (row % 2 !== 0) col = 9 - col;
            return { x: col * 10 + 5, y: (9 - row) * 10 + 5 };
        }

        // --- 3. Visual Assets (Connector Logic) ---
        function drawConnector(start, end, type) {
            const c1 = getCoords(start);
            const c2 = getCoords(end);
            const dx = c2.x - c1.x;
            const dy = c2.y - c1.y;
            const angle = Math.atan2(dx, -dy) * (180 / Math.PI);
            const distance = Math.sqrt(dx*dx + dy*dy);

            const el = document.createElement('div');
            el.className = `connector ${type}`;
            el.style.height = `${distance}%`;
            el.style.left = `${c1.x}%`;
            el.style.top = `${c1.y}%`;
            el.style.transform = `rotate(${angle}deg)`;
            
            // For snakes, add a "head"
            if (type === 'snake') {
                el.style.width = '12px';
                el.innerHTML = '<div style="width:20px;height:20px;background:#2d5a4c;border-radius:50%;margin-top:-10px;margin-left:-4px;border:2px solid gold"></div>';
            }

            document.querySelector('.board-container').appendChild(el);
        }

        // --- 4. Game Logic ---
        async function rollDice() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;

            const roll = Math.floor(Math.random() * 6) + 1;
            
            // 3D Dice Animation
            const rotations = [
                [0, 0], [0, 180], [0, -90], [0, 90], [-90, 0], [90, 0]
            ];
            const [rx, ry] = rotations[roll - 1];
            diceEl.style.transform = `rotateX(${rx + 720}deg) rotateY(${ry + 720}deg)`;

            await new Promise(r => setTimeout(r, 1000));

            await movePlayer(currentPlayer, roll);

            if (roll !== 6) {
                currentPlayer = currentPlayer === 0 ? 1 : 0;
                document.querySelectorAll('.player-card').forEach(c => c.classList.remove('active'));
                document.getElementById(`card-${currentPlayer}`).classList.add('active');
                msgEl.innerText = `Your Turn, Player ${currentPlayer + 1}`;
            } else {
                msgEl.innerText = `Lucky 6! Roll again Player ${currentPlayer + 1}`;
            }

            isRolling = false;
            rollBtn.disabled = false;
        }

        async function movePlayer(pIdx, steps) {
            let currentPos = playerPos[pIdx];
            let targetPos = currentPos + steps;

            if (targetPos > 100) {
                msgEl.innerText = "Too high! Stay put.";
                return;
            }

            // Linear Move
            for (let i = currentPos + 1; i <= targetPos; i++) {
                playerPos[pIdx] = i;
                updateCoinPos(pIdx);
                await new Promise(r => setTimeout(r, 200));
            }

            // Check Snake or Ladder
            if (MAP.ladders[playerPos[pIdx]]) {
                msgEl.innerText = "CLIMBING!";
                await new Promise(r => setTimeout(r, 400));
                playerPos[pIdx] = MAP.ladders[playerPos[pIdx]];
            } else if (MAP.snakes[playerPos[pIdx]]) {
                msgEl.innerText = "OH NO, A SNAKE!";
                await new Promise(r => setTimeout(r, 400));
                playerPos[pIdx] = MAP.snakes[playerPos[pIdx]];
            }

            updateCoinPos(pIdx);

            if (playerPos[pIdx] === 100) {
                alert(`PLAYER ${pIdx + 1} WINS!`);
                location.reload();
            }
        }

        function updateCoinPos(pIdx) {
            const coords = getCoords(playerPos[pIdx]);
            const coin = document.getElementById(`p${pIdx}-coin`);
            // Offset players slightly so they don't overlap perfectly
            const offset = pIdx === 0 ? -2 : 2;
            coin.style.left = `calc(${coords.x}% + ${offset}px)`;
            coin.style.top = `calc(${coords.y}% + ${offset}px)`;
            document.getElementById(`pos-${pIdx}`).innerText = `Position: ${playerPos[pIdx]}`;
        }

        rollBtn.addEventListener('click', rollDice);
        createBoard();
        updateCoinPos(0);
        updateCoinPos(1);
    </script>
</body>
</html>
