    <style>
        * {

        /* ✅ FIXED: main card container — now fully responsive & contains board perfectly */
        .game-container {

        .captured-pieces {

        .captured-pieces span {

        /* ✅ CHESSBOARD — FIXED: always stays within parent container (white background)

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 84px));
            border: 4px solid #d9b382;
            border-radius: 14px;

            box-shadow: 0 16px 28px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 245, 200, 0.6);
            background: #e2caa7;
            width: 100%;
            max-width: 100%;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .square {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 100%;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s linear;
            font-family: 'Segoe UI', 'Noto Sans', 'Times New Roman', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.3);
            will-change: transform;
            backdrop-filter: brightness(1.01);
            white-space: nowrap;
            line-height: 1;

        /* rich & vibrant square colors (jewel tones) */
        .square.light {
            background: #f6e7c5;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.4) 2%, transparent 3%);
            box-shadow: inset 0 0 0 1px rgba(255, 250, 210, 0.8);
        }

        .square.dark {
            background: #b77b3c;
            background-image: radial-gradient(circle at 70% 20%, rgba(230, 180, 100, 0.25) 2%, transparent 3%);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        }

        /* selected square: royal glow */
        .square.selected {
            background: #8faa6b;
            box-shadow: inset 0 0 0 3px #ffdf8c, 0 0 0 2px #eebe5e;
            transform: scale(0.99);
            transition: all 0.08s;
        }

        /* valid move marker — golden aura */
        .square.valid-move {
            position: relative;
            background: radial-gradient(circle, #d9c285, #bd9b5a);
            box-shadow: inset 0 0 8px rgba(255, 215, 0, 0.8);
        }
        .square.valid-move::after {
            content: "✨";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4rem;
            opacity: 0.7;
            color: #ffdd99;
            text-shadow: 0 0 4px #b47c2e;
            pointer-events: none;
            z-index: 2;
        }

        /* CHECK alert: ruby shimmer */
        .square.check {
            background: #e0695b;
            box-shadow: inset 0 0 0 3px #ffc107, 0 0 12px rgba(255, 80, 40, 0.7);
            animation: pulseCheck 0.9s infinite;
        }
        @keyframes pulseCheck {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.12); box-shadow: inset 0 0 0 4px #ffbe3c; }
            100% { filter: brightness(1); }
        }

        /* PRECIOUS PIECES STYLES */
        .white-piece {
            color: #f8e3b0;
            text-shadow: 0 0 5px #eab308, 2px 2px 2px #9e6d2b;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4));
            font-weight: 700;
            letter-spacing: 1px;

        .black-piece {
            color: #2e241f;
            text-shadow: 0 0 3px #e7bc7e, 1px 1px 0px #dbbc87;
            filter: drop-shadow(0 1px 2px rgba(255, 245, 150, 0.6));
            font-weight: 700;
        }
        
        .square:hover {
            filter: brightness(1.02) contrast(1.03);
            transform: scale(1.01);
            z-index: 3;
            transition: all 0.07s;
        }

        .controls button {
            background: linear-gradient(145deg, #cfa668, #a5723e);
            border: none;
            padding: 12px 32px;
            margin: 0 12px;
            border-radius: 48px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff6e0;
            cursor: pointer;
            box-shadow: 0 5px 0 #5a3a1a;
            transition: 0.1s linear;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .controls button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5a3a1a;
        }
        .controls button:hover {
            background: linear-gradient(145deg, #e2b874, #bc884a);
            color: #ffffea;
            text-shadow: 0 0 2px gold;
        }

        .status {
            margin-top: 20px;
            font-size: 1.35rem;
            font-weight: bold;
            background: #1e1915b3;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 48px;
            color: #fcd48d;
            letter-spacing: 1px;
        }

        /* ✅ IMPROVED RESPONSIVE: board stays inside white background on any device */
        @media (max-width: 780px) {
            .game-container {
                padding: 20px 16px 26px 16px;
                width: 100%;
            }
            .chessboard {
                grid-template-columns: repeat(8, minmax(0, 1fr));
                max-width: 100%;
                border-width: 3px;
            }
            .square {
                font-size: 2.6rem;
            }
            .square.valid-move::after {
                font-size: 1.8rem;
                content: "✨";
            }
            .turn-indicator {
                font-size: 1.3rem;
            }
            .controls button {
                padding: 8px 20px;
                font-size: 1rem;
                margin: 5px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .ad-container {
                max-width: 100%;
                padding: 8px 12px;
            }
            .captured-pieces {
                font-size: 0.9rem;
                gap: 12px;
            }
            .captured-pieces span {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 560px) {
            .game-container {
                padding: 16px 12px 20px 12px;
            }
            .square {
                font-size: 2rem;
            }
            .square.valid-move::after {
                font-size: 1.5rem;
                content: "✨";
            }
            .controls button {
                padding: 6px 16px;
                font-size: 0.9rem;
            }
            .game-info {
                padding: 10px 14px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }

        /* Extra small devices: ensure no overflow and board scales gracefully */
        @media (max-width: 480px) {
            .square {
                font-size: 1.7rem;
            }
            .square.valid-move::after {
                font-size: 1.2rem;
            }
            .turn-indicator {
                font-size: 1.1rem;
            }
        }
    </style>

<script>
    // ---------- INITIAL BOARD (standard setup) ----------
    const initialBoard = [
        ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
        ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
        ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let currentPlayer = 'white';   // white moves first
    let selectedSquare = null;
    let gameActive = true;
    let whiteCaptured = [];
    let blackCaptured = [];

    // --- utility: check clear path for rook/bishop/queen ---
    function isClearPath(fromRow, fromCol, toRow, toCol, board) {
        const rowStep = Math.sign(toRow - fromRow);
        const colStep = Math.sign(toCol - fromCol);
        let row = fromRow + rowStep;
        let col = fromCol + colStep;
        while (row !== toRow || col !== toCol) {
            if (board[row][col]) return false;
            row += rowStep;
            col += colStep;
        }
        return true;
    }

    // --- core move validation (standard chess rules) ---
    function isValidMove(piece, fromRow, fromCol, toRow, toCol, board, playerColor) {
        const rowDiff = toRow - fromRow;
        const colDiff = toCol - fromCol;
        const targetPiece = board[toRow][toCol];
        
        // can't capture own piece
        if (targetPiece) {
            const isWhitePiece = '♙♖♘♗♕♔'.includes(targetPiece);
            const isBlackPiece = '♟♜♞♝♛♚'.includes(targetPiece);
            if ((playerColor === 'white' && isWhitePiece) || (playerColor === 'black' && isBlackPiece)) {
                return false;
            }
        }

        // ----- PAWN -----
        if (piece === '♙' || piece === '♟') {
            const direction = piece === '♙' ? -1 : 1;
            const startRow = piece === '♙' ? 6 : 1;
            // one step forward
            if (colDiff === 0 && !targetPiece) {
                if (rowDiff === direction) return true;
                if (rowDiff === 2 * direction && fromRow === startRow && !board[fromRow + direction][fromCol]) return true;
            }
            // diagonal capture
            if (Math.abs(colDiff) === 1 && rowDiff === direction && targetPiece) {
                return true;
            }
            return false;
        }

        // ----- ROOK -----
        if (piece === '♖' || piece === '♜') {
            if (fromRow !== toRow && fromCol !== toCol) return false;
            return isClearPath(fromRow, fromCol, toRow, toCol, board);
        }

        // ----- KNIGHT -----
        if (piece === '♘' || piece === '♞') {
            return (Math.abs(rowDiff) === 2 && Math.abs(colDiff) === 1) ||
                   (Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 2);
        }

        // ----- BISHOP -----
        if (piece === '♗' || piece === '♝') {
            if (Math.abs(rowDiff) !== Math.abs(colDiff)) return false;
            return isClearPath(fromRow, fromCol, toRow, toCol, board);
        }

        // ----- QUEEN -----
        if (piece === '♕' || piece === '♛') {
            const straightMove = (fromRow === toRow || fromCol === toCol);
            const diagMove = (Math.abs(rowDiff) === Math.abs(colDiff));
            if (straightMove || diagMove) {
                return isClearPath(fromRow, fromCol, toRow, toCol, board);
            }
            return false;
        }

        // ----- KING -----
        if (piece === '♔' || piece === '♚') {
            return Math.abs(rowDiff) <= 1 && Math.abs(colDiff) <= 1;
        }

        return false;
    }

    // --- detect if a king is under attack (check) ---
    function isKingInCheck(boardState, player) {
        const king = player === 'white' ? '♔' : '♚';
        let kingPos = null;
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                if (boardState[i][j] === king) {
                    kingPos = { row: i, col: j };
                    break;
                }
            }
        }
        if (!kingPos) return false;
        const opponent = player === 'white' ? 'black' : 'white';
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const piece = boardState[i][j];
                if (piece) {
                    const isOpponentPiece = (opponent === 'white' && '♙♖♘♗♕♔'.includes(piece)) ||
                                            (opponent === 'black' && '♟♜♞♝♛♚'.includes(piece));
                    if (isOpponentPiece) {
                        if (isValidMove(piece, i, j, kingPos.row, kingPos.col, boardState, opponent)) {
                            return true;
                        }
                    }
                }
            }
        }
        return false;
    }

    // --- apply move with check validation (undo if illegal) ---
    function makeMove(fromRow, fromCol, toRow, toCol) {
        const piece = board[fromRow][fromCol];
        const targetPiece = board[toRow][toCol];
        
        // capture handling
        if (targetPiece) {
            if (currentPlayer === 'white') {
                whiteCaptured.push(targetPiece);
            } else {
                blackCaptured.push(targetPiece);
            }
            updateCapturedDisplay();
        }

        // perform move
        board[toRow][toCol] = piece;
        board[fromRow][fromCol] = '';
        
        // check if own king in danger after move -> undo
        if (isKingInCheck(board, currentPlayer)) {
            board[fromRow][fromCol] = piece;
            board[toRow][toCol] = targetPiece;
            if (targetPiece) {
                if (currentPlayer === 'white') whiteCaptured.pop();
                else blackCaptured.pop();
                updateCapturedDisplay();
            }
            return false;
        }
        return true;
    }

    // --- checkmate detection (exhaustive but accurate) ---
    function isCheckmate() {
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const piece = board[i][j];
                if (piece) {
                    const isWhitePiece = '♙♖♘♗♕♔'.includes(piece);
                    const isBlackPiece = '♟♜♞♝♛♚'.includes(piece);
                    if ((currentPlayer === 'white' && isWhitePiece) || (currentPlayer === 'black' && isBlackPiece)) {
                        for (let k = 0; k < 8; k++) {
                            for (let l = 0; l < 8; l++) {
                                if (isValidMove(piece, i, j, k, l, board, currentPlayer)) {
                                    const tempBoard = JSON.parse(JSON.stringify(board));
                                    const captured = tempBoard[k][l];
                                    tempBoard[k][l] = tempBoard[i][j];
                                    tempBoard[i][j] = '';
                                    if (!isKingInCheck(tempBoard, currentPlayer)) {
                                        return false;
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        return true;
    }

    function updateCapturedDisplay() {
        const whiteSpan = document.getElementById('whiteCaptured');
        const blackSpan = document.getElementById('blackCaptured');
        if (whiteSpan) whiteSpan.innerHTML = whiteCaptured.join(' ') || '—';
        if (blackSpan) blackSpan.innerHTML = blackCaptured.join(' ') || '—';
    }

    // --- RENDER BOARD with PRECIOUS PIECES + dynamic responsiveness ---
    function renderBoard() {
        const chessboard = document.getElementById('chessboard');
        if (!chessboard) return;
        chessboard.innerHTML = '';
        
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const piece = board[i][j];
                const isLight = (i + j) % 2 === 0;
                const square = document.createElement('div');
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.textContent = piece || '';
                square.dataset.row = i;
                square.dataset.col = j;
                
                // precious piece styling
                if (piece) {
                    if ('♙♖♘♗♕♔'.includes(piece)) {
                        square.classList.add('white-piece');
                    } else if ('♟♜♞♝♛♚'.includes(piece)) {
                        square.classList.add('black-piece');
                    }
                }
                
                // selected square highlight
                if (selectedSquare && selectedSquare.row === i && selectedSquare.col === j) {
                    square.classList.add('selected');
                }
                
                // show check on king
                if (piece === '♔' && isKingInCheck(board, 'white')) {
                    square.classList.add('check');
                }
                if (piece === '♚' && isKingInCheck(board, 'black')) {
                    square.classList.add('check');
                }
                
                square.addEventListener('click', (function(row, col) {
                    return function() { handleSquareClick(row, col); };
                })(i, j));
                
                chessboard.appendChild(square);
            }
        }
        // after render, re-show valid moves if any piece selected
        if (selectedSquare) {
            showValidMoves(selectedSquare.row, selectedSquare.col);
        }
    }

    // display valid moves (for selected piece)
    function showValidMoves(row, col) {
        const piece = board[row][col];
        const squares = document.querySelectorAll('.square');
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                if (isValidMove(piece, row, col, i, j, board, currentPlayer)) {
                    const idx = i * 8 + j;
                    if (squares[idx]) squares[idx].classList.add('valid-move');
                }
            }
        }
    }

    function clearValidMoves() {
        document.querySelectorAll('.square').forEach(sq => sq.classList.remove('valid-move'));
    }

    // --- square click handler ---
    function handleSquareClick(row, col) {
        if (!gameActive) return;
        
        const piece = board[row][col];
        
        // No piece selected yet
        if (selectedSquare === null) {
            if (piece) {
                const isWhitePiece = '♙♖♘♗♕♔'.includes(piece);
                const isBlackPiece = '♟♜♞♝♛♚'.includes(piece);
                if ((currentPlayer === 'white' && isWhitePiece) || (currentPlayer === 'black' && isBlackPiece)) {
                    selectedSquare = { row, col };
                    renderBoard();               // fresh render with selection
                    showValidMoves(row, col);
                }
            }
        } else {
            const fromRow = selectedSquare.row;
            const fromCol = selectedSquare.col;
            const movingPiece = board[fromRow][fromCol];
            
            if (isValidMove(movingPiece, fromRow, fromCol, row, col, board, currentPlayer)) {
                if (makeMove(fromRow, fromCol, row, col)) {
                    // switch turn
                    currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
                    const turnElem = document.getElementById('turnIndicator');
                    if (turnElem) {
                        turnElem.innerHTML = currentPlayer === 'white' ? '⚜️ White\'s Turn ⚜️' : '🖤 Black\'s Turn 🖤';
                    }
                    
                    if (isCheckmate()) {
                        const winner = currentPlayer === 'white' ? 'Black' : 'White';
                        const statusDiv = document.getElementById('status');
                        if (statusDiv) statusDiv.innerHTML = `🏆 ${winner} wins by CHECKMATE! 🏆`;
                        gameActive = false;
                        selectedSquare = null;
                        renderBoard();
                        return;
                    }
                    
                    const statusDiv = document.getElementById('status');
                    if (isKingInCheck(board, currentPlayer)) {
                        if (statusDiv) statusDiv.innerHTML = `⚠️ ${currentPlayer === 'white' ? 'White' : 'Black'} is in CHECK! ⚠️`;
                    } else {
                        if (statusDiv) statusDiv.innerHTML = '';
                    }
                }
            }
            selectedSquare = null;
            renderBoard();
        }
    }

    // --- full reset ---
    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        currentPlayer = 'white';
        selectedSquare = null;
        gameActive = true;
        whiteCaptured = [];
        blackCaptured = [];
        
        const turnElem = document.getElementById('turnIndicator');
        if (turnElem) turnElem.innerHTML = '⚜️ White\'s Turn ⚜️';
        const statusDiv = document.getElementById('status');
        if (statusDiv) statusDiv.innerHTML = '';
        updateCapturedDisplay();
        renderBoard();
    }

    // --- back to hub navigation ---
    document.getElementById('resetBtn')?.addEventListener('click', resetGame);
    document.getElementById('backBtn')?.addEventListener('click', () => {
        window.location.href = '../index.html';
    });
    
    // initial render
    renderBoard();
</script>
</body>
</html>
