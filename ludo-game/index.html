<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo Classic - Board Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="board" id="ludoBoard"></div>
            
            <div class="game-controls">
                <div class="turn-indicator" id="turnIndicator">
                    <div class="turn-label">Current Turn</div>
                    <div class="turn-player" id="turnPlayer">🔴 Red</div>
                </div>
                
                <div class="dice-section">
                    <div class="dice-container" id="diceContainer">
                        <div class="dice" id="dice">
                            <div class="dice-face" id="diceFace">⚀</div>
                        </div>
                    </div>
                    <button class="btn btn-roll" id="rollBtn">🎲 Roll Dice</button>
                </div>
                
                <div class="game-status" id="gameStatus">
                    Roll a 6 to start!
                </div>
                
                <button class="btn btn-reset" id="resetBtn">🔄 New Game</button>
            </div>
        </div>
    </div>

    <script src="js/board.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
