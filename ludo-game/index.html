<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Classic</title>

<style>

:root{
    --red:#e53935;
    --green:#43a047;
    --yellow:#fdd835;
    --blue:#1e88e5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ececec;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    gap:18px;
    padding:20px;
}

h1{
    font-size:38px;
}

.controls{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
}

.turn-btn{
    padding:12px 22px;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    background:white;
    box-shadow:0 6px 12px rgba(0,0,0,0.25);
}

.new-game-btn{
    padding:12px 22px;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(145deg,#ffffff,#d9d9d9);
    box-shadow:
      0 6px 12px rgba(0,0,0,0.25),
      inset 2px 2px 4px rgba(255,255,255,0.9),
      inset -2px -2px 4px rgba(0,0,0,0.15);
}

.board{
    width:min(92vw,720px);
    aspect-ratio:1;
    background:white;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    border:4px solid #111;
    position:relative;
}

.cell{
    border:1px solid #ccc;
}

.red-bg{background:var(--red);}
.green-bg{background:var(--green);}
.blue-bg{background:var(--blue);}
.yellow-bg{background:var(--yellow);}

.safe-star{
    position:relative;
}

.safe-star::before{
    content:"★";
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:22px;
    text-shadow:0 0 5px black;
}

.yard{
    position:absolute;
    width:40%;
    height:40%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.red-yard{left:0;bottom:0;background:var(--red);}
.blue-yard{left:0;top:0;background:var(--blue);}
.green-yard{right:0;top:0;background:var(--green);}
.yellow-yard{right:0;bottom:0;background:var(--yellow);}

.yard-inner{
    width:68%;
    height:68%;
    background:white;
    border-radius:10px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15%;
    padding:12%;
}

.token{
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:
      inset -5px -5px 10px rgba(0,0,0,0.25),
      inset 5px 5px 8px rgba(255,255,255,0.4),
      0 4px 8px rgba(0,0,0,0.4);
}

.red{background:var(--red);}
.blue{background:var(--blue);}
.green{background:var(--green);}
.yellow{background:var(--yellow);}

.center{
    grid-column:7/10;
    grid-row:7/10;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
}

.c-red{background:var(--red);}
.c-blue{background:var(--blue);}
.c-green{background:var(--green);}
.c-yellow{background:var(--yellow);}

.winner{
    background:white;
    border-radius:50%;
    margin:10%;
    border:3px solid #555;
}

/* 3D DICE */

.scene{
    width:80px;
    height:80px;
    perspective:600px;
}

.dice{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 1s;
    cursor:pointer;
}

.face{
    position:absolute;
    width:80px;
    height:80px;
    background:white;
    border:3px solid #111;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:32px;
    font-weight:bold;
}

.front{transform:translateZ(40px);}
.back{transform:rotateY(180deg) translateZ(40px);}
.right{transform:rotateY(90deg) translateZ(40px);}
.left{transform:rotateY(-90deg) translateZ(40px);}
.top{transform:rotateX(90deg) translateZ(40px);}
.bottom{transform:rotateX(-90deg) translateZ(40px);}

</style>
</head>

<body>

<h1>🎲 Ludo Classic</h1>

<div class="controls">

<button class="turn-btn" id="turnBtn">
🔴 Red Turn
</button>

<div class="scene">
<div class="dice" id="dice">

<div class="face front">1</div>
<div class="face back">6</div>
<div class="face right">3</div>
<div class="face left">4</div>
<div class="face top">5</div>
<div class="face bottom">2</div>

</div>
</div>

<button class="new-game-btn" id="newGameBtn">
🎮 New Game
</button>

</div>

<div class="board" id="board"></div>

<script>

const board=document.getElementById("board");

function createCell(r,c,cls=""){
    const cell=document.createElement("div");
    cell.className=`cell ${cls}`;
    cell.style.gridRow=r;
    cell.style.gridColumn=c;
    board.appendChild(cell);
}

for(let r=1;r<=15;r++){
    for(let c=1;c<=15;c++){
        createCell(r,c);
    }
}

/* STAR CELLS */

createCell(14,7,"red-bg safe-star");
createCell(9,3,"safe-star");
createCell(7,2,"blue-bg safe-star");
createCell(3,7,"safe-star");
createCell(2,9,"green-bg safe-star");
createCell(7,13,"safe-star");
createCell(9,14,"yellow-bg safe-star");
createCell(13,9,"safe-star");

/* HOME PATHS */

for(let r=10;r<=14;r++) createCell(r,8,"red-bg");
for(let c=2;c<=6;c++) createCell(8,c,"blue-bg");
for(let r=2;r<=6;r++) createCell(r,8,"green-bg");
for(let c=10;c<=14;c++) createCell(8,c,"yellow-bg");

/* CENTER */

const center=document.createElement("div");
center.className="center";

center.innerHTML=`
<div class="c-blue"></div>
<div class="c-green"></div>
<div class="c-green"></div>

<div class="c-blue"></div>
<div class="winner"></div>
<div class="c-yellow"></div>

<div class="c-red"></div>
<div class="c-red"></div>
<div class="c-yellow"></div>
`;

board.appendChild(center);

/* YARDS */

const yards=[
["blue-yard","blue"],
["green-yard","green"],
["red-yard","red"],
["yellow-yard","yellow"]
];

yards.forEach(y=>{

    const yard=document.createElement("div");
    yard.className=`yard ${y[0]}`;

    const inner=document.createElement("div");
    inner.className="yard-inner";

    for(let i=0;i<4;i++){

        const token=document.createElement("div");
        token.className=`token ${y[1]}`;

        inner.appendChild(token);
    }

    yard.appendChild(inner);
    board.appendChild(yard);

});

/* TURN SYSTEM */

const players=[
"🔴 Red",
"🔵 Blue",
"🟢 Green",
"🟡 Yellow"
];

let currentPlayer=0;

const turnBtn=document.getElementById("turnBtn");

function updateTurn(){
    turnBtn.innerHTML=players[currentPlayer]+" Turn";
}

updateTurn();

/* DICE */

const dice=document.getElementById("dice");

dice.addEventListener("click",()=>{

    const value=Math.floor(Math.random()*6)+1;

    dice.style.transform=
    `rotateX(${360*3}deg) rotateY(${360*3}deg)`;

    setTimeout(()=>{

        switch(value){

            case 1:
                dice.style.transform='rotateX(0deg) rotateY(0deg)';
                break;

            case 2:
                dice.style.transform='rotateX(90deg)';
                break;

            case 3:
                dice.style.transform='rotateY(-90deg)';
                break;

            case 4:
                dice.style.transform='rotateY(90deg)';
                break;

            case 5:
                dice.style.transform='rotateX(-90deg)';
                break;

            case 6:
                dice.style.transform='rotateY(180deg)';
                break;
        }

        currentPlayer=(currentPlayer+1)%4;

        updateTurn();

    },1000);

});

/* NEW GAME */

document.getElementById("newGameBtn")
.addEventListener("click",()=>{
    location.reload();
});

</script>

</body>
</html>
