<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .board-container {
            position: relative;
        }

        #ludoCanvas {
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            max-width: 100%;
            height: auto;
        }

        .game-panel {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
        }

        .player-info {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .player-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 5px solid #ccc;
        }

        .player-card.active {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .player-card.red { border-left-color: #FF3B30; }
        .player-card.blue { border-left-color: #007AFF; }
        .player-card.green { border-left-color: #34C759; }
        .player-card.yellow { border-left-color: #FFCC00; }

        .player-name {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .stat {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8em;
            color: #999;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.3em;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .dice-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 15px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;

        .dice:hover {

        }

        .dice.rolling {

        }

        @keyframes rollDice {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.2); }
        }

        .roll-button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .roll-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .roll-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #856404;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success { background: #d4edda; border-color: #28a745; color: #155724; }
        .message.error { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .message.info { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px currentColor); }
            50% { filter: drop-shadow(0 0 15px currentColor); }
        }

        @media (max-width: 768px) {
            .game-content {
                flex-direction: column;
            }
            
            .game-header h1 {
                font-size: 1.8em;
            }
            
            #ludoCanvas {
                width: 100%;
            }
        }

        .winner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .winner-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .winner-content h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .winner-content p {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .restart-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .restart-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🎲 Master Ludo 🎲</h1>
        </div>
        
        <div class="game-content">
            <div class="board-container">
                <canvas id="ludoCanvas" width="600" height="600"></canvas>
            </div>
            
            <div class="game-panel">
                <div class="player-info" id="playerInfo"></div>
                
                <div class="dice-container">
                    <div class="dice" id="diceDisplay">?</div>
                    <button class="roll-button" id="rollButton">Roll Dice</button>

                </div>
            </div>
        </div>
    </div>

    <div class="winner-modal" id="winnerModal">
        <div class="winner-content">

        </div>
    </div>

    <script>
        const canvas = document.getElementById('ludoCanvas');
        const ctx = canvas.getContext('2d');
        
        const COLORS = {
            red: '#FF3B30',
            blue: '#007AFF',
            green: '#34C759',
            yellow: '#FFCC00'
        };

        const TILE_SIZE = 40;
        const BOARD_SIZE = 15;
        
        // Game state
        const gameState = {
            players: [
                { color: 'red', name: 'Player 1', pieces: [], score: 0, piecesHome: 0 },
                { color: 'blue', name: 'Player 2', pieces: [], score: 0, piecesHome: 0 },
                { color: 'green', name: 'Player 3', pieces: [], score: 0, piecesHome: 0 },
                { color: 'yellow', name: 'Player 4', pieces: [], score: 0, piecesHome: 0 }
            ],
            currentPlayerIndex: 0,
            diceValue: 0,
            consecutiveSixes: 0,
            gameStarted: false,
            selectedPiece: null,
            waitingForPieceSelection: false
        };

        // Define the path coordinates (52 tiles around the board + 5 home path tiles)
        const createPath = () => {
            const path = [];
            
            // Starting from Red's entry point (6, 1) going clockwise
            // Bottom row of top section (right)
            for (let i = 1; i <= 5; i++) path.push([6, i]);
            
            // Right column going down
            for (let i = 6; i <= 8; i++) path.push([i, 6]);
            
            // Enter blue section
            for (let i = 7; i <= 13; i++) path.push([8, i]);
            
            // Down to green section
            for (let i = 9; i <= 13; i++) path.push([i, 13]);
            
            // Left across bottom
            for (let i = 12; i >= 9; i--) path.push([13, i]);
            
            // Down the bottom left
            for (let i = 12; i >= 9; i--) path.push([i, 8]);
            
            // Left into yellow section
            for (let i = 7; i >= 1; i--) path.push([8, i]);
            
            // Up into red section
            for (let i = 7; i >= 1; i--) path.push([i, 1]);
            
            return path;
        };

        const mainPath = createPath();
        
        // Safe zones (star positions)
        const safeZones = [0, 8, 13, 21, 26, 34, 39, 47];
        
        // Starting positions for each color
        const startPositions = {
            red: 0,
            blue: 13,
            green: 26,
            yellow: 39
        };
        
        // Home paths (colored triangular paths to center)
        const homePaths = {
            red: [[6, 2], [6, 3], [6, 4], [6, 5], [6, 6]],
            blue: [[9, 6], [10, 6], [11, 6], [12, 6], [6, 6]],
            green: [[8, 12], [8, 11], [8, 10], [8, 9], [6, 6]],
            yellow: [[5, 8], [4, 8], [3, 8], [2, 8], [6, 6]]
        };

        // Initialize pieces
        const initializePieces = () => {
            const basePositions = {
                red: [[1.5, 1.5], [3.5, 1.5], [1.5, 3.5], [3.5, 3.5]],
                blue: [[10.5, 1.5], [12.5, 1.5], [10.5, 3.5], [12.5, 3.5]],
                green: [[10.5, 10.5], [12.5, 10.5], [10.5, 12.5], [12.5, 12.5]],
                yellow: [[1.5, 10.5], [3.5, 10.5], [1.5, 12.5], [3.5, 12.5]]
            };

            gameState.players.forEach(player => {
                player.pieces = basePositions[player.color].map((pos, i) => ({
                    id: i,
                    position: -1, // -1 means in base
                    basePosition: pos,
                    onBoard: false,
                    inHomePath: false,
                    homePathIndex: -1,
                    isHome: false,
                    clickable: false
                }));
            });
        };

        // Draw the board
        const drawBoard = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw base areas
            drawBase('red', 0, 0);
            drawBase('blue', 9, 0);
            drawBase('green', 9, 9);
            drawBase('yellow', 0, 9);
            
            // Draw the path
            drawPath();
            
            // Draw home area (center)
            drawHomeArea();
            
            // Draw pieces
            drawAllPieces();
        };

        const drawBase = (color, startX, startY) => {
            // Outer square
            ctx.fillStyle = COLORS[color];
            ctx.fillRect(startX * TILE_SIZE, startY * TILE_SIZE, 6 * TILE_SIZE, 6 * TILE_SIZE);
            
            // Inner white square
            ctx.fillStyle = 'white';
            ctx.fillRect((startX + 1) * TILE_SIZE, (startY + 1) * TILE_SIZE, 4 * TILE_SIZE, 4 * TILE_SIZE);
            
            // Draw 4 circles for piece positions
            const positions = [[1.5, 1.5], [3.5, 1.5], [1.5, 3.5], [3.5, 3.5]];
            positions.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc((startX + x) * TILE_SIZE, (startY + y) * TILE_SIZE, TILE_SIZE * 0.6, 0, Math.PI * 2);
                ctx.strokeStyle = COLORS[color];
                ctx.lineWidth = 3;
                ctx.stroke();
            });
        };

        const drawPath = () => {
            mainPath.forEach((pos, index) => {
                const [row, col] = pos;
                const x = col * TILE_SIZE;
                const y = row * TILE_SIZE;
                
                // Checkered pattern
                if ((row + col) % 2 === 0) {
                    ctx.fillStyle = '#f0f0f0';
                } else {
                    ctx.fillStyle = 'white';
                }
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                
                // Border
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                
                // Safe zones (stars)
                if (safeZones.includes(index)) {
                    drawStar(x + TILE_SIZE / 2, y + TILE_SIZE / 2, 5, TILE_SIZE * 0.3, TILE_SIZE * 0.15, '#FFD700');
                }
            });
            
            // Draw colored home paths
            Object.keys(homePaths).forEach(color => {
                homePaths[color].forEach(([row, col]) => {
                    const x = col * TILE_SIZE;
                    const y = row * TILE_SIZE;
                    ctx.fillStyle = COLORS[color];
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.globalAlpha = 1;
                });
            });
            
            // Draw starting arrows
            Object.keys(startPositions).forEach(color => {
                const index = startPositions[color];
                const [row, col] = mainPath[index];
                drawArrow(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2, COLORS[color]);
            });
        };

        const drawStar = (cx, cy, spikes, outerRadius, innerRadius, color) => {
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        };

        const drawArrow = (x, y, color) => {
            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.moveTo(x, y - 8);
            ctx.lineTo(x - 6, y + 6);
            ctx.lineTo(x + 6, y + 6);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
        };

        const drawHomeArea = () => {
            const centerX = 6 * TILE_SIZE;
            const centerY = 6 * TILE_SIZE;
            const size = 3 * TILE_SIZE;
            
            // Draw four colored triangles
            const triangles = [
                { color: 'red', points: [[0, 0], [size, 0], [size / 2, size / 2]] },
                { color: 'blue', points: [[size, 0], [size, size], [size / 2, size / 2]] },
                { color: 'green', points: [[size, size], [0, size], [size / 2, size / 2]] },
                { color: 'yellow', points: [[0, size], [0, 0], [size / 2, size / 2]] }
            ];
            
            triangles.forEach(({ color, points }) => {
                ctx.fillStyle = COLORS[color];
                ctx.beginPath();
                points.forEach(([x, y], i) => {
                    const px = centerX + x;
                    const py = centerY + y;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.fill();
            });
            
            // Center circle
            ctx.beginPath();
            ctx.arc(centerX + size / 2, centerY + size / 2, TILE_SIZE * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        };

        const drawPiece = (x, y, color, glow = false, pulse = false) => {
            ctx.save();
            
            if (glow) {
                ctx.shadowColor = COLORS[color];
                ctx.shadowBlur = 20;
            }
            
            if (pulse) {
                const scale = 1 + 0.1 * Math.sin(Date.now() / 200);
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.translate(-x, -y);
            }
            
            // 3D effect
            const gradient = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, TILE_SIZE * 0.35);
            gradient.addColorStop(0, 'white');
            gradient.addColorStop(0.3, COLORS[color]);
            gradient.addColorStop(1, shadeColor(COLORS[color], -30));
            
            ctx.beginPath();
            ctx.arc(x, y, TILE_SIZE * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Border
            ctx.strokeStyle = shadeColor(COLORS[color], -40);
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Highlight
            ctx.beginPath();
            ctx.arc(x - 5, y - 5, TILE_SIZE * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fill();
            
            ctx.restore();
        };

        const shadeColor = (color, percent) => {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255))
                .toString(16).slice(1);
        };

        const drawAllPieces = () => {
            gameState.players.forEach(player => {
                player.pieces.forEach(piece => {
                    let x, y;
                    
                    if (piece.isHome) {
                        return; // Don't draw pieces that reached home
                    } else if (!piece.onBoard) {
                        // In base
                        [x, y] = piece.basePosition;
                        x = x * TILE_SIZE;
                        y = y * TILE_SIZE;
                    } else if (piece.inHomePath) {
                        // In home path
                        const [row, col] = homePaths[player.color][piece.homePathIndex];
                        x = col * TILE_SIZE + TILE_SIZE / 2;
                        y = row * TILE_SIZE + TILE_SIZE / 2;
                    } else {
                        // On main path
                        const [row, col] = mainPath[piece.position];
                        x = col * TILE_SIZE + TILE_SIZE / 2;
                        y = row * TILE_SIZE + TILE_SIZE / 2;
                    }
                    
                    const isActive = player === getCurrentPlayer();
                    const shouldPulse = piece.clickable && gameState.waitingForPieceSelection;
                    drawPiece(x, y, player.color, isActive, shouldPulse);
                });
            });
        };

        const getCurrentPlayer = () => {
            return gameState.players[gameState.currentPlayerIndex];
        };

        // Dice rolling
        const rollDice = () => {
            const diceDisplay = document.getElementById('diceDisplay');
            const rollButton = document.getElementById('rollButton');
            
            rollButton.disabled = true;
            diceDisplay.classList.add('rolling');
            
            let rolls = 0;
            const rollInterval = setInterval(() => {
                diceDisplay.textContent = Math.floor(Math.random() * 6) + 1;
                rolls++;
                
                if (rolls >= 8) {
                    clearInterval(rollInterval);
                    const finalValue = Math.floor(Math.random() * 6) + 1;
                    diceDisplay.textContent = finalValue;
                    diceDisplay.classList.remove('rolling');
                    
                    setTimeout(() => {
                        processDiceRoll(finalValue);
                    }, 500);
                }
            }, 100);
        };

        const processDiceRoll = (value) => {
            gameState.diceValue = value;
            const player = getCurrentPlayer();
            
            if (value === 6) {
                gameState.consecutiveSixes++;

                    gameState.consecutiveSixes = 0;
                    setTimeout(() => nextTurn(), 2000);
                    return;

                gameState.consecutiveSixes = 0;

                        nextTurn();
                    } else {
                        document.getElementById('rollButton').disabled = false;
                    }

                gameState.waitingForPieceSelection = true;
                showMessage('Select a piece to move', 'info');

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #FF3B30, #007AFF, #34C759, #FFCC00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .players-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .player-card {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 3px solid transparent;
        }

        .player-card.active {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-color: white;
        }

        .player-card.red { background: linear-gradient(135deg, #FF3B30, #ff6b66); color: white; }
        .player-card.blue { background: linear-gradient(135deg, #007AFF, #4d9fff); color: white; }
        .player-card.green { background: linear-gradient(135deg, #34C759, #66d785); color: white; }
        .player-card.yellow { background: linear-gradient(135deg, #FFCC00, #ffd633); color: #333; }

        .player-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .player-score {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .player-pieces-home {
            margin-top: 5px;
            font-size: 0.85em;
        }

        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        #ludoCanvas {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 100%;
            height: auto;
        }

        .controls {
            text-align: center;
        }

        .dice-container {
            display: inline-block;
            margin-bottom: 20px;
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
        }

        .dice:hover {
            transform: scale(1.1);
        }

        .dice.rolling {
            animation: diceRoll 0.5s ease-in-out;
        }

        @keyframes diceRoll {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(0.9); }
            75% { transform: rotate(270deg) scale(1.1); }
        }

        .message {
            min-height: 30px;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f0f0f0;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 1.8em;
            }
            .players-info {
                grid-template-columns: repeat(2, 1fr);
            }
            #ludoCanvas {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🎲 Master Ludo 🎲</h1>
        </div>

        <div class="players-info" id="playersInfo"></div>

        <div class="board-container">
            <canvas id="ludoCanvas" width="600" height="600"></canvas>
        </div>

        <div class="controls">
            <div class="dice-container">
                <div class="dice" id="dice">🎲</div>
            </div>
            <div class="message" id="message">Click "New Game" to start!</div>
            <button class="btn" id="newGameBtn">New Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ludoCanvas');
        const ctx = canvas.getContext('2d');
        const diceEl = document.getElementById('dice');
        const messageEl = document.getElementById('message');
        const playersInfoEl = document.getElementById('playersInfo');
        const newGameBtn = document.getElementById('newGameBtn');

        // Game constants
        const COLORS = {
            red: '#FF3B30',
            blue: '#007AFF',
            green: '#34C759',
            yellow: '#FFCC00'
        };

        const PLAYER_ORDER = ['red', 'blue', 'green', 'yellow'];
        const BOARD_SIZE = 600;
        const CELL_SIZE = BOARD_SIZE / 15;

        // Game state
        let gameState = {
            currentPlayer: 0,
            diceValue: null,
            canRoll: true,
            consecutiveSixes: 0,
            players: {},
            winner: null,
            selectedPiece: null
        };

        // Path coordinates for each color (clockwise movement)
        const PATHS = {
            red: generatePath(6, 1, 'right'),
            blue: generatePath(1, 8, 'down'),
            green: generatePath(8, 13, 'left'),
            yellow: generatePath(13, 6, 'up')
        };

        const SAFE_ZONES = [0, 8, 13, 21, 26, 34, 39, 47]; // Positions on the track that are safe

        function generatePath(startRow, startCol, direction) {
            const path = [];
            let row = startRow;
            let col = startCol;

            // Starting position
            path.push({x: col, y: row});

            // Main track (51 positions total)
            const moves = [
                {dir: direction, count: 5},
                {dir: direction === 'right' ? 'down' : direction === 'down' ? 'left' : direction === 'left' ? 'up' : 'right', count: 6},
                {dir: direction === 'right' ? 'down' : direction === 'down' ? 'left' : direction === 'left' ? 'up' : 'right', count: 6},
                {dir: direction === 'right' ? 'left' : direction === 'down' ? 'up' : direction === 'left' ? 'right' : 'down', count: 6},
                {dir: direction === 'right' ? 'left' : direction === 'down' ? 'up' : direction === 'left' ? 'right' : 'down', count: 6},
                {dir: direction === 'right' ? 'up' : direction === 'down' ? 'right' : direction === 'left' ? 'down' : 'left', count: 6},
                {dir: direction === 'right' ? 'up' : direction === 'down' ? 'right' : direction === 'left' ? 'down' : 'left', count: 6},
                {dir: direction, count: 6},
                {dir: direction, count: 1}
            ];

            // Simplified path generation
            if (direction === 'right') {
                // Red path
                for (let i = 1; i <= 5; i++) path.push({x: col + i, y: row});
                for (let i = 1; i <= 6; i++) path.push({x: col + 5, y: row - i});
                for (let i = 1; i <= 6; i++) path.push({x: col + 5 + i, y: row - 6});
                for (let i = 1; i <= 6; i++) path.push({x: col + 11, y: row - 6 + i});
                for (let i = 1; i <= 6; i++) path.push({x: col + 11, y: row + i});
                for (let i = 1; i <= 6; i++) path.push({x: col + 11 - i, y: row + 6});
                for (let i = 1; i <= 6; i++) path.push({x: col + 5, y: row + 6 + i});
                for (let i = 1; i <= 6; i++) path.push({x: col + 5 - i, y: row + 12});
                for (let i = 1; i <= 5; i++) path.push({x: col - i, y: row + 12});
                // Home path
                for (let i = 1; i <= 5; i++) path.push({x: col + 1, y: row + 12 - i});
            } else if (direction === 'down') {
                // Blue path - starts at top, goes down
                for (let i = 1; i <= 5; i++) path.push({x: col, y: row + i});
                for (let i = 1; i <= 6; i++) path.push({x: col + i, y: row + 5});
                for (let i = 1; i <= 6; i++) path.push({x: col + 6, y: row + 5 + i});
                for (let i = 1; i <= 6; i++) path.push({x: col + 6 - i, y: row + 11});
                for (let i = 1; i <= 6; i++) path.push({x: col - i, y: row + 11});
                for (let i = 1; i <= 6; i++) path.push({x: col - 6, y: row + 11 - i});
                for (let i = 1; i <= 6; i++) path.push({x: col - 6 - i, y: row + 5});
                for (let i = 1; i <= 6; i++) path.push({x: col - 12, y: row + 5 - i});
                for (let i = 1; i <= 5; i++) path.push({x: col - 12, y: row - i});
                // Home path
                for (let i = 1; i <= 5; i++) path.push({x: col - 12 + i, y: row + 1});
            } else if (direction === 'left') {
                // Green path
                for (let i = 1; i <= 5; i++) path.push({x: col - i, y: row});
                for (let i = 1; i <= 6; i++) path.push({x: col - 5, y: row + i});
                for (let i = 1; i <= 6; i++) path.push({x: col - 5 - i, y: row + 6});
                for (let i = 1; i <= 6; i++) path.push({x: col - 11, y: row + 6 - i});
                for (let i = 1; i <= 6; i++) path.push({x: col - 11, y: row - i});
                for (let i = 1; i <= 6; i++) path.push({x: col - 11 + i, y: row - 6});
                for (let i = 1; i <= 6; i++) path.push({x: col - 5, y: row - 6 - i});
                for (let i = 1; i <= 6; i++) path.push({x: col - 5 + i, y: row - 12});
                for (let i = 1; i <= 5; i++) path.push({x: col + i, y: row - 12});
                // Home path
                for (let i = 1; i <= 5; i++) path.push({x: col - 1, y: row - 12 + i});
            } else {
                // Yellow path - starts at bottom, goes up
                for (let i = 1; i <= 5; i++) path.push({x: col, y: row - i});
                for (let i = 1; i <= 6; i++) path.push({x: col - i, y: row - 5});
                for (let i = 1; i <= 6; i++) path.push({x: col - 6, y: row - 5 - i});
                for (let i = 1; i <= 6; i++) path.push({x: col - 6 + i, y: row - 11});
                for (let i = 1; i <= 6; i++) path.push({x: col + i, y: row - 11});
                for (let i = 1; i <= 6; i++) path.push({x: col + 6, y: row - 11 + i});
                for (let i = 1; i <= 6; i++) path.push({x: col + 6 + i, y: row - 5});
                for (let i = 1; i <= 6; i++) path.push({x: col + 12, y: row - 5 + i});
                for (let i = 1; i <= 5; i++) path.push({x: col + 12, y: row + i});
                // Home path
                for (let i = 1; i <= 5; i++) path.push({x: col + 12 - i, y: row - 1});
            }

            return path;
        }

        function initGame() {
            gameState = {
                currentPlayer: 0,
                diceValue: null,
                canRoll: true,
                consecutiveSixes: 0,
                winner: null,
                selectedPiece: null,
                players: {}
            };

            PLAYER_ORDER.forEach(color => {
                gameState.players[color] = {
                    pieces: [
                        { id: 0, position: -1, inYard: true, atHome: false },
                        { id: 1, position: -1, inYard: true, atHome: false },
                        { id: 2, position: -1, inYard: true, atHome: false },
                        { id: 3, position: -1, inYard: true, atHome: false }
                    ],
                    score: 0
                };
            });

            updatePlayersInfo();
            drawBoard();
            setMessage(`${getCurrentPlayerName()}'s turn. Roll the dice!`);
        }

        function getCurrentPlayerName() {
            return PLAYER_ORDER[gameState.currentPlayer].toUpperCase();
        }

        function getCurrentColor() {
            return PLAYER_ORDER[gameState.currentPlayer];
        }

        function drawBoard() {
            ctx.clearRect(0, 0, BOARD_SIZE, BOARD_SIZE);

            // Draw background
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, BOARD_SIZE, BOARD_SIZE);

            // Draw the four corner yards
            drawYard(0, 0, 'red');
            drawYard(9, 0, 'blue');
            drawYard(9, 9, 'green');
            drawYard(0, 9, 'yellow');

            // Draw center home area
            drawHomeArea();

            // Draw the track
            drawTrack();

            // Draw all pieces
            drawAllPieces();
        }

        function drawYard(startX, startY, color) {
            const x = startX * CELL_SIZE;
            const y = startY * CELL_SIZE;
            const size = 6 * CELL_SIZE;

            // Gradient background
            const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
            gradient.addColorStop(0, COLORS[color]);
            gradient.addColorStop(1, COLORS[color] + 'aa');
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, size, size);

            // Border
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, size, size);

            // Draw piece positions in yard
            const positions = [
                {x: startX + 1.5, y: startY + 1.5},
                {x: startX + 4.5, y: startY + 1.5},
                {x: startX + 1.5, y: startY + 4.5},
                {x: startX + 4.5, y: startY + 4.5}
            ];

            positions.forEach((pos, i) => {
                ctx.beginPath();
                ctx.arc(pos.x * CELL_SIZE, pos.y * CELL_SIZE, CELL_SIZE * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function drawHomeArea() {
            const center = 7.5 * CELL_SIZE;
            const size = 3 * CELL_SIZE;

            // Draw four triangles
            const triangles = [
                {color: 'red', points: [{x: center, y: center}, {x: center, y: center - size}, {x: center + size, y: center}]},
                {color: 'blue', points: [{x: center, y: center}, {x: center + size, y: center}, {x: center, y: center + size}]},
                {color: 'green', points: [{x: center, y: center}, {x: center, y: center + size}, {x: center - size, y: center}]},
                {color: 'yellow', points: [{x: center, y: center}, {x: center - size, y: center}, {x: center, y: center - size}]}
            ];

            triangles.forEach(triangle => {
                ctx.beginPath();
                ctx.moveTo(triangle.points[0].x, triangle.points[0].y);
                ctx.lineTo(triangle.points[1].x, triangle.points[1].y);
                ctx.lineTo(triangle.points[2].x, triangle.points[2].y);
                ctx.closePath();
                ctx.fillStyle = COLORS[triangle.color];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function drawTrack() {
            // Draw main track cells
            const trackCells = [
                // Red track
                ...Array.from({length: 6}, (_, i) => ({x: 6, y: i, color: 'white'})),
                ...Array.from({length: 3}, (_, i) => ({x: 6 + i, y: 0, color: 'white'})),
                ...Array.from({length: 6}, (_, i) => ({x: 8, y: i, color: 'white'})),
                // Blue track
                ...Array.from({length: 6}, (_, i) => ({x: 9 + i, y: 6, color: 'white'})),
                ...Array.from({length: 3}, (_, i) => ({x: 14, y: 6 + i, color: 'white'})),
                ...Array.from({length: 6}, (_, i) => ({x: 9 + i, y: 8, color: 'white'})),
                // Green track
                ...Array.from({length: 6}, (_, i) => ({x: 8, y: 9 + i, color: 'white'})),
                ...Array.from({length: 3}, (_, i) => ({x: 8 - i, y: 14, color: 'white'})),
                ...Array.from({length: 6}, (_, i) => ({x: 6, y: 9 + i, color: 'white'})),
                // Yellow track
                ...Array.from({length: 6}, (_, i) => ({x: i, y: 8, color: 'white'})),
                ...Array.from({length: 3}, (_, i) => ({x: 0, y: 8 - i, color: 'white'})),
                ...Array.from({length: 6}, (_, i) => ({x: i, y: 6, color: 'white'}))
            ];

            trackCells.forEach(cell => {
                const x = cell.x * CELL_SIZE;
                const y = cell.y * CELL_SIZE;
                
                // Checkered pattern
                ctx.fillStyle = ((cell.x + cell.y) % 2 === 0) ? '#ffffff' : '#f0f0f0';
                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
            });

            // Draw safe zones with stars
            const safeZonePositions = [
                {x: 6, y: 2}, // Red safe
                {x: 12, y: 6}, // Blue safe
                {x: 8, y: 12}, // Green safe
                {x: 2, y: 8}  // Yellow safe
            ];

            safeZonePositions.forEach(pos => {
                drawStar(pos.x * CELL_SIZE + CELL_SIZE / 2, pos.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE / 3);
            });

            // Draw starting points
            const startPoints = [
                {x: 6, y: 1, color: 'red'},
                {x: 13, y: 6, color: 'blue'},
                {x: 8, y: 13, color: 'green'},
                {x: 1, y: 8, color: 'yellow'}
            ];

            startPoints.forEach(point => {
                const x = point.x * CELL_SIZE;
                const y = point.y * CELL_SIZE;
                ctx.fillStyle = COLORS[point.color];
                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
            });

            // Draw home paths (colored paths leading to center)
            const homePaths = [
                {x: 7, y: 1, color: 'red', count: 5, dir: 'down'},
                {x: 13, y: 7, color: 'blue', count: 5, dir: 'left'},
                {x: 7, y: 13, color: 'green', count: 5, dir: 'up'},
                {x: 1, y: 7, color: 'yellow', count: 5, dir: 'right'}
            ];

            homePaths.forEach(path => {
                for (let i = 0; i < path.count; i++) {
                    let cellX = path.x;
                    let cellY = path.y;
                    
                    if (path.dir === 'down') cellY += i;
                    else if (path.dir === 'up') cellY -= i;
                    else if (path.dir === 'left') cellX -= i;
                    else if (path.dir === 'right') cellX += i;

                    ctx.fillStyle = COLORS[path.color] + '66';
                    ctx.fillRect(cellX * CELL_SIZE, cellY * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = COLORS[path.color];
                    ctx.lineWidth = 2;
                    ctx.strokeRect(cellX * CELL_SIZE, cellY * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            });
        }

        function drawStar(cx, cy, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.translate(cx, cy);
            ctx.moveTo(0, -radius);
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI / 5);
                ctx.lineTo(0, -radius * 0.4);
                ctx.rotate(Math.PI / 5);
                ctx.lineTo(0, -radius);
            }
            ctx.closePath();
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.strokeStyle = '#FFA500';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawAllPieces() {
            PLAYER_ORDER.forEach(color => {
                gameState.players[color].pieces.forEach((piece, index) => {
                    drawPiece(color, piece, index);
                });
            });
        }

        function drawPiece(color, piece, index) {
            let x, y;

            if (piece.inYard) {
                // In yard
                const yardPositions = {
                    red: [{x: 1.5, y: 1.5}, {x: 4.5, y: 1.5}, {x: 1.5, y: 4.5}, {x: 4.5, y: 4.5}],
                    blue: [{x: 10.5, y: 1.5}, {x: 13.5, y: 1.5}, {x: 10.5, y: 4.5}, {x: 13.5, y: 4.5}],
                    green: [{x: 10.5, y: 10.5}, {x: 13.5, y: 10.5}, {x: 10.5, y: 13.5}, {x: 13.5, y: 13.5}],
                    yellow: [{x: 1.5, y: 10.5}, {x: 4.5, y: 10.5}, {x: 1.5, y: 13.5}, {x: 4.5, y: 13.5}]
                };
                const pos = yardPositions[color][index];
                x = pos.x * CELL_SIZE;
                y = pos.y * CELL_SIZE;
            } else if (piece.atHome) {
                // In home (center)
                x = 7.5 * CELL_SIZE;
                y = 7.5 * CELL_SIZE;
                // Offset pieces at home slightly
                const offsets = [{x: -5, y: -5}, {x: 5, y: -5}, {x: -5, y: 5}, {x: 5, y: 5}];
                x += offsets[index].x;
                y += offsets[index].y;
            } else {
                // On track
                const path = getSimplifiedPath(color);
                if (piece.position >= 0 && piece.position < path.length) {
                    const pos = path[piece.position];
                    x = pos.x * CELL_SIZE;
                    y = pos.y * CELL_SIZE;
                } else {
                    return; // Invalid position
                }
            }

            // Draw piece with 3D effect
            const radius = CELL_SIZE * 0.35;
            
            // Shadow
            ctx.beginPath();
            ctx.arc(x + 2, y + 2, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();

            // Main piece
            const gradient = ctx.createRadialGradient(x - radius/3, y - radius/3, 0, x, y, radius);
            gradient.addColorStop(0, lightenColor(COLORS[color], 40));
            gradient.addColorStop(1, COLORS[color]);
            
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Border
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Glow effect for current player's pieces
            if (color === getCurrentColor() && !piece.inYard && gameState.diceValue) {
                if (canMovePiece(color, piece.id, gameState.diceValue)) {
                    ctx.shadowColor = COLORS[color];
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
                    ctx.strokeStyle = COLORS[color];
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
        }

        function getSimplifiedPath(color) {
            // Simplified path for rendering - actual track positions
            const basePaths = {
                red: [
                    {x: 6, y: 1}, {x: 6, y: 2}, {x: 6, y: 3}, {x: 6, y: 4}, {x: 6, y: 5},
                    {x: 5, y: 6}, {x: 4, y: 6}, {x: 3, y: 6}, {x: 2, y: 6}, {x: 1, y: 6}, {x: 0, y: 6},
                    {x: 0, y: 7}, {x: 0, y: 8},

        function lightenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 +
                (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255))
                .toString(16).slice(1);
        }

        function rollDice() {
            if (!gameState.canRoll || gameState.winner) return;

            gameState.canRoll = false;
            diceEl.classList.add('rolling');

            let rollCount = 0;
            const rollInterval = setInterval(() => {
                diceEl.textContent = Math.floor(Math.random() * 6) + 1;
                rollCount++;
                if (rollCount >= 10) {
                    clearInterval(rollInterval);
                    const finalValue = Math.floor(Math.random() * 6) + 1;
                    gameState.diceValue = finalValue;
                    diceEl.textContent = finalValue;
                    diceEl.classList.remove('rolling');
                    handleDiceRoll(finalValue);
                }
            }, 50);
        }

        function handleDiceRoll(value) {
            const color = getCurrentColor();
            
            if (value === 6) {
                gameState.consecutiveSixes++;
                if (gameState.consecutiveSixes === 3) {
                    setMessage(`${getCurrentPlayerName()} rolled 3 sixes! Turn forfeited.`);
                    setTimeout(() => nextPlayer(), 2000);
                    return;
                }
            }

            const movablePieces = getMovablePieces(color, value);
            
            if (movablePieces.length === 0) {
                setMessage(`No valid moves for ${getCurrentPlayerName()}. Turn skipped.`);
                setTimeout(() => nextPlayer(), 2000);
                return;
            }

            if (movablePieces.length === 1) {
                // Auto-move if only one piece can move
                setTimeout(() => movePiece(color, movablePieces[0].id, value), 500);
            } else {
                setMessage(`${getCurrentPlayerName()}, select a piece to move.`);
                // Pieces are selectable via click
            }

            drawBoard();
        }

        function getMovablePieces(color, diceValue) {
            return gameState.players[color].pieces.filter(piece => 
                canMovePiece(color, piece.id, diceValue)
            );
        }

        function canMovePiece(color, pieceId, diceValue) {
            const piece = gameState.players[color].pieces[pieceId];
            
            if (piece.atHome) return false;
            
            if (piece.inYard) {
                return diceValue === 6;
            }
            
            const newPosition = piece.position + diceValue;
            const path = getSimplifiedPath(color);
            
            // Check if move goes beyond home (last 6 positions are home path)
            if (newPosition > path.length - 1) return false;
            
            return true;
        }

        function movePiece(color, pieceId, steps) {
            const piece = gameState.players[color].pieces[pieceId];
            const player = gameState.players[color];
            
            if (piece.inYard && steps === 6) {
                // Move from yard to start
                piece.inYard = false;
                piece.position = 0;
                player.score += 10;
                animateMovement(color, pieceId, () => {
                    checkCapture(color, pieceId);
                    if (steps === 6) {
                        setMessage(`${getCurrentPlayerName()} gets another turn!`);
                        gameState.canRoll = true;
                    } else {
                        nextPlayer();
                    }
                });
            } else if (!piece.inYard && !piece.atHome) {
                const oldPosition = piece.position;
                piece.position += steps;
                const path = getSimplifiedPath(color);
                
                if (piece.position >= path.length - 1) {
                    // Reached home
                    piece.atHome = true;
                    player.score += 100;
                    animateMovement(color, pieceId, () => {
                        checkWinCondition(color);
                        if (steps === 6 && !gameState.winner) {
                            setMessage(`${getCurrentPlayerName()} gets another turn!`);
                            gameState.canRoll = true;
                        } else if (!gameState.winner) {
                            nextPlayer();
                        }
                    });
                } else {
                    player.score += steps * 10;
                    animateMovement(color, pieceId, () => {
                        const captured = checkCapture(color, pieceId);
                        if (steps === 6) {
                            setMessage(`${getCurrentPlayerName()} gets another turn!`);
                            gameState.canRoll = true;
                        } else if (captured) {
                            setMessage(`${getCurrentPlayerName()} captured a piece! Extra roll!`);
                            gameState.canRoll = true;
                        } else {
                            nextPlayer();
                        }
                    });
                }
            }
            
            updatePlayersInfo();
        }

        function animateMovement(color, pieceId, callback) {
            // Simple redraw (in production, add smooth animation)
            drawBoard();
            setTimeout(callback, 300);
        }

        function checkCapture(color, pieceId) {
            const piece = gameState.players[color].pieces[pieceId];
            const path = getSimplifiedPath(color);
            const currentPos = path[piece.position];
            
            let captured = false;
            
            // Check if on safe zone
            const safePositions = [0, 8, 13, 21, 26, 34, 39, 47];
            if (safePositions.includes(piece.position)) return false;
            
            // Check for opponent pieces at same position
            PLAYER_ORDER.forEach(opponentColor => {
                if (opponentColor === color) return;
                
                gameState.players[opponentColor].pieces.forEach((opponentPiece, idx) => {
                    if (opponentPiece.inYard || opponentPiece.atHome) return;
                    
                    const opponentPath = getSimplifiedPath(opponentColor);
                    const opponentPos = opponentPath[opponentPiece.position];
                    
                    if (currentPos && opponentPos && 
                        currentPos.x === opponentPos.x && 
                        currentPos.y === opponentPos.y) {
                        // Capture!
                        opponentPiece.inYard = true;
                        opponentPiece.position = -1;
                        gameState.players[color].score += 50;
                        captured = true;
                    }
                });
            });
            
            return captured;
        }

        function checkWinCondition(color) {
            const allHome = gameState.players[color].pieces.every(piece => piece.atHome);
            
            if (allHome) {
                gameState.winner = color;
                setMessage(`🎉 ${color.toUpperCase()} WINS! 🎉`);
                setTimeout(() => {
                    if (confirm(`${color.toUpperCase()} wins! Play again?`)) {
                        initGame();
                    }
                }, 1000);
            }
        }

        function nextPlayer() {
            gameState.currentPlayer = (gameState.currentPlayer + 1) % 4;
            gameState.diceValue = null;
            gameState.canRoll = true;
            gameState.consecutiveSixes = 0;
            updatePlayersInfo();
            setMessage(`${getCurrentPlayerName()}'s turn. Roll the dice!`);
            drawBoard();
        }

        function setMessage(text) {
            messageEl.textContent = text;
        }

        function updatePlayersInfo() {
            playersInfoEl.innerHTML = '';
            
            PLAYER_ORDER.forEach((color, index) => {
                const player = gameState.players[color];
                const piecesAtHome = player.pieces.filter(p => p.atHome).length;
                
                const card = document.createElement('div');
                card.className = `player-card ${color}`;
                if (index === gameState.currentPlayer) {
                    card.classList.add('active');
                }
                
                card.innerHTML = `
                    <div class="player-name">${color.toUpperCase()}</div>
                    <div class="player-score">Score: ${player.score}</div>
                    <div class="player-pieces-home">Home: ${piecesAtHome}/4</div>
                `;
                
                playersInfoEl.appendChild(card);
            });
        }

        // Event listeners
        diceEl.addEventListener('click', rollDice);
        newGameBtn.addEventListener('click', initGame);

        canvas.addEventListener('click', (e) => {
            if (!gameState.diceValue || gameState.canRoll || gameState.winner) return;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;
            
            const color = getCurrentColor();
            const movablePieces = getMovablePieces(color, gameState.diceValue);
            
            movablePieces.forEach(piece => {
                let pieceX, pieceY;
                
                if (piece.inYard) {
                    const yardPositions = {
                        red: [{x: 1.5, y: 1.5}, {x: 4.5, y: 1.5}, {x: 1.5, y: 4.5}, {x: 4.5, y: 4.5}],
                        blue: [{x: 10.5, y: 1.5}, {x: 13.5, y: 1.5}, {x: 10.5, y: 4.5}, {x: 13.5, y: 4.5}],
                        green: [{x: 10.5, y: 10.5}, {x: 13.5, y: 10.5}, {x: 10.5, y: 13.5}, {x: 13.5, y: 13.5}],
                        yellow: [{x: 1.5, y: 10.5}, {x: 4.5, y: 10.5}, {x: 1.5, y: 13.5}, {x: 4.5, y: 13.5}]
                    };
                    const pos = yardPositions[color][piece.id];
                    pieceX = pos.x * CELL_SIZE;
                    pieceY = pos.y * CELL_SIZE;
                } else {
                    const path = getSimplifiedPath(color);
                    const pos = path[piece.position];
                    pieceX = pos.x * CELL_SIZE;
                    pieceY = pos.y * CELL_SIZE;
                }
                
                const distance = Math.sqrt((clickX - pieceX) ** 2 + (clickY - pieceY) ** 2);
                if (distance < CELL_SIZE * 0.4) {
                    movePiece(color, piece.id, gameState.diceValue);
                }
            });
        });

        // Initialize game on load
        initGame();
    </script>
